<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="FX战士久留美 同人交易模拟器 · 非官方粉丝作品">
<title>FX戦士くるみちゃん · 交易模拟器</title>
<style>/* ============================================================
 * style.css  FX战士久留美 · 交易模拟器
 * 深色交易终端 × 萌系番剧质感
 * ============================================================ */
:root{
  --bg:#05070c;
  --bg2:#0a0f18;
  --panel:rgba(19,26,41,.82);
  --panel2:rgba(26,35,54,.9);
  --line:rgba(255,255,255,.075);
  --line2:rgba(255,255,255,.14);
  --tx:#e8eefc;
  --tx2:rgba(232,238,252,.62);
  --tx3:rgba(232,238,252,.38);
  /* 默认：国际 FX 惯例（绿涨红跌） */
  --up:#3ddc97;
  --dn:#ff4d6d;
  --up-rgb:61,220,151;
  --dn-rgb:255,77,109;
  --gold:#ffd166;
  --pink:#ff8fb1;
  --purple:#c084fc;
  --blue:#8cb4ff;
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --tabh:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:"Hiragino Sans","Noto Sans CJK SC","PingFang SC",system-ui,-apple-system,sans-serif;
  color:var(--tx);font-size:14px;line-height:1.45;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  background:
    radial-gradient(900px 480px at 12% -8%, rgba(255,143,177,.10), transparent 62%),
    radial-gradient(760px 480px at 92% 105%, rgba(140,180,255,.10), transparent 60%),
    var(--bg);
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}

/* ================= 顶部资产栏 ================= */
#hud{
  position:relative;z-index:30;padding:calc(var(--safe-t) + 8px) 12px 8px;
  background:linear-gradient(180deg,rgba(8,12,20,.97),rgba(8,12,20,.72));
  border-bottom:1px solid var(--line);backdrop-filter:blur(14px);
}
.hud-top{display:flex;align-items:center;gap:8px}
.hud-name{font-size:11.5px;color:var(--tx3);letter-spacing:.04em;flex:1}
.hud-name b{color:var(--pink);font-weight:700}
.hud-clock{font-size:11px;color:var(--tx2)}
.hud-eq{display:flex;align-items:flex-end;gap:6px;margin-top:2px}
.hud-eq .lbl{font-size:10px;color:var(--tx3);padding-bottom:3px}
#equityVal{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;
  transition:color .25s}
#equityVal.flash-up{animation:valFlashUp .5s ease}
#equityVal.flash-dn{animation:valFlashDn .5s ease}
@keyframes valFlashUp{0%{transform:translateY(0);color:var(--up);text-shadow:0 0 18px rgba(61,220,151,.9)}100%{transform:translateY(0)}}
@keyframes valFlashDn{0%{transform:translateY(0);color:var(--dn);text-shadow:0 0 18px rgba(255,77,109,.9)}100%{transform:translateY(0)}}
#eqDelta{font-size:12px;font-weight:700;padding-bottom:3px}
.hud-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}
.hud-cell{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:9px;padding:4px 7px;min-width:0}
.hud-cell .k{font-size:9px;color:var(--tx3);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-cell .v{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-cell.warn{border-color:rgba(255,77,109,.45);background:rgba(255,77,109,.10)}
.hud-cell.warn .v{color:var(--dn)}
.margin-bar{height:4px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden;position:relative}
.margin-bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--up);transition:width .25s ease,background .3s}
.margin-bar b{position:absolute;top:-1px;left:20%;width:2px;height:6px;background:rgba(255,255,255,.55)}
/* 刻度含义：0% = 维持率50%（强平线）, 20% = 100%（追证线）, 100% = 300% */

/* ================= 内容区 ================= */
#screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;padding:8px 10px calc(var(--tabh) + var(--safe-b) + 14px);
  opacity:0;transform:translateY(10px) scale(.995);pointer-events:none;
  transition:opacity .24s ease,transform .28s cubic-bezier(.2,.9,.25,1)}
.screen.on{opacity:1;transform:none;pointer-events:auto}
.screen.leave{opacity:0;transform:translateY(-8px) scale(.995)}

/* ================= 卡片 ================= */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;margin-bottom:9px;backdrop-filter:blur(12px);position:relative;overflow:hidden}
.card.tap{transition:transform .16s cubic-bezier(.2,.9,.25,1),border-color .2s}
.card.tap:active{transform:scale(.982);border-color:var(--line2)}
.card-title{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx2);
  font-weight:700;letter-spacing:.02em;margin-bottom:8px}
.card-title .dot{width:6px;height:6px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink)}
.card-title .right{margin-left:auto;font-weight:600;font-size:11px;color:var(--tx3)}

/* ================= 按钮 ================= */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;
  height:46px;border-radius:12px;font-size:14.5px;font-weight:800;letter-spacing:.03em;
  background:var(--panel2);border:1px solid var(--line2);
  transition:transform .13s cubic-bezier(.2,.9,.25,1),filter .2s,box-shadow .25s;
  position:relative;overflow:hidden}
.btn:active{transform:scale(.955)}
.btn:disabled{opacity:.36;filter:grayscale(.5)}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);
  transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.btn-buy{background:linear-gradient(160deg,#1f8f63,#0e5c40);border-color:rgba(61,220,151,.5);color:#eafff5;
  box-shadow:0 6px 22px -8px rgba(61,220,151,.7)}
.btn-sell{background:linear-gradient(160deg,#a8304c,#6b1130);border-color:rgba(255,77,109,.5);color:#fff0f4;
  box-shadow:0 6px 22px -8px rgba(255,77,109,.7)}
.btn-gold{background:linear-gradient(160deg,#d9a92f,#8a6510);border-color:rgba(255,209,102,.5);color:#1a1200}
.btn-ghost{background:rgba(255,255,255,.05)}
.btn-danger{background:linear-gradient(160deg,#b03050,#701030);border-color:rgba(255,77,109,.4)}
.btn-sm{height:34px;font-size:12.5px;border-radius:9px;padding:0 11px}
.btn-xs{height:28px;font-size:11.5px;border-radius:8px;padding:0 9px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}

/* ================= 图表页 ================= */
.pair-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.pair-tab{flex:0 0 auto;padding:6px 11px;border-radius:20px;font-size:12px;font-weight:700;
  background:rgba(255,255,255,.045);border:1px solid var(--line);color:var(--tx2);
  transition:all .22s cubic-bezier(.2,.9,.25,1)}
.pair-tab.on{background:rgba(255,143,177,.16);border-color:rgba(255,143,177,.65);color:#fff;
  box-shadow:0 0 18px -4px rgba(255,143,177,.6);transform:translateY(-1px)}
#chartWrap{height:262px;position:relative;border-radius:var(--r);overflow:hidden;
  background:linear-gradient(180deg,rgba(10,16,26,.9),rgba(6,10,17,.95));border:1px solid var(--line)}
#chart{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.chart-badge{position:absolute;top:8px;left:10px;display:flex;gap:6px;align-items:baseline;pointer-events:none}
.chart-badge .p{font-size:20px;font-weight:800;letter-spacing:-.02em}
.chart-badge .d{font-size:12px;font-weight:700}
.chart-tools{display:flex;gap:6px;margin-top:7px}
.chart-tools .seg{display:flex;background:rgba(255,255,255,.05);border-radius:9px;
  border:1px solid var(--line);overflow:hidden;flex:1}
.chart-tools .seg button{flex:1;height:30px;font-size:11.5px;font-weight:700;color:var(--tx2);transition:all .2s}
.chart-tools .seg button.on{background:rgba(255,143,177,.18);color:#fff}

/* 价格大屏 */
.quote{display:flex;align-items:baseline;gap:8px;margin:2px 0 4px}
.quote .big{font-size:30px;font-weight:800;letter-spacing:-.03em}
.quote .sub{font-size:12px;color:var(--tx2)}
.tick-flash{transition:none}
.tick-up{color:var(--up)!important}
.tick-dn{color:var(--dn)!important}

/* ================= 下单面板 ================= */
.order{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-top:9px}
.lev-row{display:flex;align-items:center;gap:9px}
.lev-row .k{font-size:11px;color:var(--tx3);width:44px;flex:0 0 auto}
input[type=range]{-webkit-appearance:none;appearance:none;height:26px;background:transparent;flex:1;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:4px;
  background:linear-gradient(90deg,var(--up),var(--gold) 55%,var(--dn))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:#fff;margin-top:-8.5px;box-shadow:0 0 0 4px rgba(255,143,177,.28),0 3px 10px rgba(0,0,0,.5);
  transition:box-shadow .2s}
input[type=range]:active::-webkit-slider-thumb{box-shadow:0 0 0 8px rgba(255,143,177,.32),0 3px 14px rgba(0,0,0,.6)}
.lev-val{font-size:16px;font-weight:800;width:52px;text-align:right;flex:0 0 auto}
.lev-val.hot{color:var(--dn);text-shadow:0 0 14px rgba(255,77,109,.7)}
.amt-chips{display:flex;gap:6px;margin:8px 0}
.amt-chips button{flex:1;height:32px;border-radius:9px;font-size:11.5px;font-weight:700;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--tx2);transition:all .18s}
.amt-chips button.on{background:rgba(255,209,102,.16);border-color:rgba(255,209,102,.6);color:#fff}
.order-sum{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;margin:9px 0 11px;
  font-size:11.5px;background:rgba(0,0,0,.25);border-radius:10px;padding:9px 10px;border:1px solid var(--line)}
.order-sum .l{color:var(--tx3)}
.order-sum .r{text-align:right;font-weight:700}
.risk-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;
  font-size:10.5px;font-weight:800;letter-spacing:.04em}
.risk-1{background:rgba(61,220,151,.16);color:var(--up);border:1px solid rgba(61,220,151,.4)}
.risk-2{background:rgba(255,209,102,.16);color:var(--gold);border:1px solid rgba(255,209,102,.4)}
.risk-3{background:rgba(255,143,177,.16);color:var(--pink);border:1px solid rgba(255,143,177,.4)}
.risk-4{background:rgba(255,77,109,.20);color:var(--dn);border:1px solid rgba(255,77,109,.55);
  animation:riskPulse 1.4s infinite}
@keyframes riskPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,109,.5)}50%{box-shadow:0 0 0 7px rgba(255,77,109,0)}}

/* ================= 持仓 ================= */
.pos{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 11px;margin-bottom:8px;position:relative;overflow:hidden;
  animation:posIn .32s cubic-bezier(.2,.9,.25,1)}
@keyframes posIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
.pos::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.pos.long::before{background:var(--up);box-shadow:0 0 14px var(--up)}
.pos.short::before{background:var(--dn);box-shadow:0 0 14px var(--dn)}
.pos-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.pos-head .pair{font-size:14px;font-weight:800}
.dir-tag{font-size:10px;font-weight:900;padding:1.5px 7px;border-radius:5px;letter-spacing:.06em}
.dir-tag.long{background:rgba(61,220,151,.2);color:var(--up)}
.dir-tag.short{background:rgba(255,77,109,.2);color:var(--dn)}
.pos-pnl{margin-left:auto;font-size:17px;font-weight:800;text-align:right}
.pos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;font-size:10.5px}
.pos-grid .k{color:var(--tx3)}
.pos-grid .v{font-weight:700}
.pos-bar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:7px;overflow:hidden}
.pos-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--dn),var(--gold),var(--up));
  transition:width .3s ease}
.pos-actions{display:flex;gap:6px;margin-top:8px}

/* ================= 借贷 ================= */
.loan-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;margin-bottom:9px;position:relative;overflow:hidden;
  transition:transform .16s,border-color .2s}
.loan-card:active{transform:scale(.985)}
.loan-card .bar{position:absolute;top:0;left:0;right:0;height:2px}
.loan-h{display:flex;align-items:center;gap:8px}
.loan-h .nm{font-size:14px;font-weight:800}
.loan-h .rt{margin-left:auto;font-size:15px;font-weight:900}
.loan-desc{font-size:11.5px;color:var(--tx2);margin:5px 0 8px;line-height:1.5}
.loan-meta{display:flex;gap:10px;font-size:10.5px;color:var(--tx3)}
.loan-meter{height:5px;background:rgba(255,255,255,.07);border-radius:3px;margin:8px 0 4px;overflow:hidden}
.loan-meter i{display:block;height:100%;border-radius:3px;transition:width .4s cubic-bezier(.2,.9,.25,1)}
.debt-fire{animation:debtFire 2.2s infinite}
@keyframes debtFire{0%,100%{opacity:.85}50%{opacity:1;filter:drop-shadow(0 0 8px rgba(255,77,109,.9))}}

/* ================= 弹层 ================= */
.mask{position:fixed;inset:0;background:rgba(2,4,8,.72);backdrop-filter:blur(6px);
  z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;
  background:linear-gradient(180deg,#151d2e,#0b111c);
  border-top:1px solid var(--line2);border-radius:20px 20px 0 0;
  padding:16px 15px calc(18px + var(--safe-b));max-height:88vh;overflow-y:auto;
  transform:translateY(102%);transition:transform .38s cubic-bezier(.16,1,.3,1);
  box-shadow:0 -22px 60px rgba(0,0,0,.7)}
.sheet.on{transform:none}
.sheet-grip{width:38px;height:4px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:.01em}
.sheet .sub{font-size:12px;color:var(--tx2);margin-bottom:12px;line-height:1.55}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;color:var(--tx3);margin-bottom:5px;font-weight:600}
.field input[type=number],.field input[type=text]{width:100%;height:46px;border-radius:11px;
  background:rgba(0,0,0,.4);border:1px solid var(--line2);color:var(--tx);
  padding:0 12px;font-size:18px;font-weight:800;letter-spacing:.01em}
.field input:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,143,177,.17)}

/* 教学 / 剧情对话 */
.tut{position:fixed;left:10px;right:10px;bottom:calc(var(--tabh) + var(--safe-b) + 10px);z-index:90;
  background:linear-gradient(160deg,rgba(30,26,44,.97),rgba(16,20,32,.98));
  border:1px solid rgba(255,143,177,.35);border-radius:16px;padding:12px 13px;
  box-shadow:0 16px 44px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.03) inset;
  transform:translateY(20px) scale(.97);opacity:0;pointer-events:none;
  transition:all .34s cubic-bezier(.16,1,.3,1)}
.tut.on{transform:none;opacity:1;pointer-events:auto}
.tut .who{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--pink);margin-bottom:5px}
.tut .who .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(140deg,var(--pink),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#12060d}
.tut .body{font-size:13px;line-height:1.62;color:var(--tx)}
.tut .body .hl{color:var(--gold);font-weight:800}
.tut .body .warn{color:var(--dn);font-weight:800}
.tut .foot{display:flex;align-items:center;margin-top:9px;gap:8px}
.tut .pages{font-size:10px;color:var(--tx3)}

/* 浮动数字 */
.floaty{position:fixed;z-index:95;font-weight:900;font-size:16px;pointer-events:none;
  animation:floatUp 1.15s cubic-bezier(.2,.8,.3,1) forwards;text-shadow:0 2px 12px rgba(0,0,0,.8)}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px) scale(.8)}
  18%{opacity:1;transform:translateY(-4px) scale(1.12)}
  100%{opacity:0;transform:translateY(-52px) scale(1)}}

/* 全屏警报 */
.alert-full{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none;opacity:0}
.alert-full.on{opacity:1}
.alert-full .flashbg{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,46,91,.5),rgba(120,0,30,.72));
  animation:alertPulse .5s ease-out}
@keyframes alertPulse{0%{opacity:1}100%{opacity:.12}}
.alert-full .txt{font-size:36px;font-weight:900;letter-spacing:.06em;color:#fff;
  text-shadow:0 0 30px rgba(255,46,91,1),0 4px 22px rgba(0,0,0,.9);
  animation:alertIn .6s cubic-bezier(.16,1,.3,1)}
.alert-full .sm{font-size:13px;color:#ffd9e2;margin-top:8px;letter-spacing:.08em}
@keyframes alertIn{0%{transform:scale(2.4);opacity:0;filter:blur(10px)}60%{transform:scale(.96)}100%{transform:scale(1);opacity:1}}

/* 屏幕震动 */
.shake{animation:shk .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}
  30%,50%,70%{transform:translate(-6px,2px)}40%,60%{transform:translate(6px,-1px)}}

/* 覆盖层：进场序章 */
#cover{position:fixed;inset:0;z-index:200;background:#05070c;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;transition:opacity .6s}
#cover.off{opacity:0;pointer-events:none}
.cv-title{font-size:27px;font-weight:900;letter-spacing:.02em;text-align:center;line-height:1.35}
.cv-title small{display:block;font-size:12px;font-weight:600;color:var(--tx3);letter-spacing:.24em;margin-top:8px}
.cv-line{font-size:12.5px;color:var(--tx2);text-align:center;max-width:290px;line-height:1.75;min-height:66px}
.cv-btn{margin-top:6px;padding:13px 40px;border-radius:30px;font-weight:800;font-size:15px;
  background:linear-gradient(140deg,var(--pink),#e0578c);color:#170a11;
  box-shadow:0 12px 34px -10px rgba(255,143,177,.85);animation:breathe 2.4s infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.scanline{position:absolute;inset:0;pointer-events:none;opacity:.22;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}

/* 底部标签栏 */
#tabs{position:relative;z-index:40;display:flex;height:var(--tabh);
  padding-bottom:var(--safe-b);background:linear-gradient(180deg,rgba(9,13,21,.86),rgba(9,13,21,.99));
  border-top:1px solid var(--line);backdrop-filter:blur(16px)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:9.5px;font-weight:700;color:var(--tx3);position:relative;transition:color .2s}
#tabs button .ic{font-size:18px;line-height:1;transition:transform .26s cubic-bezier(.16,1,.3,1)}
#tabs button.on{color:var(--pink)}
#tabs button.on .ic{transform:translateY(-2px) scale(1.16)}

<script>
/* ===== 01-util.js ===== */
/* ============================================================
 * FX战士久留美 - 交易模拟器
 * 01-util.js  基础工具 / 数学 / 随机数 / 存储 / 音效 / 触感
 * ============================================================ */
const U = (() => {
  'use strict';

  /** 有种子随机数（mulberry32）—— 保证同一存档回放一致 */
  function rngFrom(seed) {
    let a = seed >>> 0;
    const f = () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return f;
  }

  /** 标准正态（Box-Muller） */
  function gauss(rnd) {
    let u = 0, v = 0;
    while (u === 0) u = rnd();
    while (v === 0) v = rnd();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const lerp = (a, b, t) => a + (b - a) * t;
  const inst = (c, v) => c + (v - c) * 0.22;         // 指数光滑（帧率无关的近似）
  const instDt = (c, v, dt, speed) => c + (v - c) * (1 - Math.exp(-dt * speed));

  /** 千分位 */
  function fmt(n, dec) {
    if (n === null || n === undefined || !isFinite(n)) return '—';
    const neg = n < 0;
    const d = dec === undefined ? 0 : dec;
    const s = Math.abs(n).toFixed(d).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + s;
  }

  /** 带正负号 */
  function sfmt(n, dec) {
    if (n === null || n === undefined || !isFinite(n)) return '—';
    return (n > 0 ? '+' : n < 0 ? '-' : '') + fmt(Math.abs(n), dec === undefined ? 0 : dec);
  }

  /** 日元金额缩写 */
  function yenShort(n) {
    const a = Math.abs(n);
    if (a >= 1e8) return (n / 1e8).toFixed(2) + '亿';
    if (a >= 1e4) return (n / 1e4).toFixed(a >= 1e6 ? 0 : 1) + '万';
    return fmt(n, 0);
  }

  function pct(n, dec) {
    return fmt(n, dec === undefined ? 1 : dec) + '%';
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /** 游戏内日期：起始 2021/04/05 星期一 */
  const MONTH_DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  function addDays(y, m, d, n) {
    let t = Date.UTC(y, m - 1, d) + n * 86400000;
    const dt = new Date(t);
    return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate(), w: dt.getUTCDay() };
  }
  function dateLabel(dt) {
    return `${dt.m}/${dt.d}(${WEEK[dt.w]})`;
  }

  /** 淡入淡出的定时器集合（切场景时统一清理） */
  function makeTimers() {
    const set = new Set();
    return {
      after(ms, fn) {
        const id = setTimeout(() => { set.delete(id); fn(); }, ms);
        set.add(id); return id;
      },
      every(ms, fn) {
        const id = setInterval(fn, ms);
        set.add(id); return id;
      },
      clear(id) { clearTimeout(id); clearInterval(id); set.delete(id); },
      clearAll() { set.forEach(id => { clearTimeout(id); clearInterval(id); }); set.clear(); }
    };
  }

  /** 简易深合并（用于存档迁移） */
  function merge(base, patch) {
    if (patch === null || patch === undefined) return base;
    if (Array.isArray(base)) return Array.isArray(patch) ? patch : base;
    if (typeof base === 'object' && typeof patch === 'object') {
      const out = {};
      for (const k in base) out[k] = merge(base[k], patch[k]);
      for (const k in patch) if (!(k in out)) out[k] = patch[k];
      return out;
    }
    return patch;
  }

  return { rngFrom, gauss, clamp, lerp, inst, instDt, fmt, sfmt, yenShort, pct, pad2,
           addDays, dateLabel, MONTH_DAYS, WEEK, makeTimers, merge };
})();

/* ---------------- 触感反馈 ---------------- */
const Haptics = (() => {
  'use strict';
  let ok = true;
  function buzz(p) {
    if (!ok) return;
    try {
      // APK 版：原生震动桥接（比 WebView 的 navigator.vibrate 更可靠）
      if (window.AndroidVibe && typeof AndroidVibe.buzz === 'function') {
        AndroidVibe.buzz(Array.isArray(p) ? p.join(',') : String(p));
        return;
      }
      if (navigator.vibrate) { navigator.vibrate(p); return; }
      if (window.AndroidBridge && AndroidBridge.vibrate) { AndroidBridge.vibrate(Array.isArray(p) ? p[0] : p); }
    } catch (e) { /* 失败就静默降级，不影响游戏 */ }
  }
  return {
    tap()   { buzz(8); },
    press() { buzz(16); },
    win()   { buzz([0, 14, 40, 26]); },
    lose()  { buzz([0, 34, 50, 34, 50, 60]); },
    crash() { buzz([0, 90, 40, 90, 40, 160, 60, 240]); },
  };
})();

/* ---------------- 音效（纯 WebAudio 合成，无外部资源） ---------------- */
const Sfx = (() => {
  'use strict';
  let ctx = null, master = null, enabled = true, started = false;

  function boot() {
    if (started) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.5;
      master.connect(ctx.destination);
      started = true;
      return true;
    } catch (e) { return false; }
  }
  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
  function setEnabled(v) { enabled = v; if (master) master.gain.value = v ? 0.5 : 0; }
  function isEnabled() { return enabled; }

  function tone(freq, dur, type, vol, slideTo, delay) {
    if (!enabled || !boot()) return;
    resume();
    const t0 = (ctx.currentTime) + (delay || 0);
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime((vol === undefined ? 0.2 : vol), t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }

  function noise(dur, vol, freq, q) {
    if (!enabled || !boot()) return;
    resume();
    const t0 = ctx.currentTime;
    const n = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = freq || 900; bp.Q.value = q || 1.2;
    const g = ctx.createGain(); g.gain.value = vol || 0.2;
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t0);
  }

  return {
    setEnabled, isEnabled, boot, resume,
    click()    { tone(1250, 0.05, 'square', 0.06); },
    open()     { tone(660, 0.1, 'sine', 0.12, 990); },
    close()    { tone(520, 0.12, 'sine', 0.1, 330); },
    buy()      { tone(523, 0.1, 'triangle', 0.18); tone(784, 0.16, 'triangle', 0.14, null, 0.07); },
    sell()     { tone(392, 0.1, 'triangle', 0.18); tone(294, 0.16, 'triangle', 0.14, null, 0.07); },
    error()    { tone(180, 0.16, 'sawtooth', 0.14); },
    coin()     { tone(988, 0.07, 'square', 0.1); tone(1319, 0.12, 'square', 0.08, null, 0.05); },
    bigwin()   { [659, 784, 988, 1319].forEach((f, i) => tone(f, 0.26, 'triangle', 0.16, null, i * 0.08)); },
    lose()     { tone(300, 0.3, 'sawtooth', 0.13, 120); },
    crash()    {
      noise(0.7, 0.3, 420, 0.7);
      tone(140, 0.8, 'sawtooth', 0.2, 48);
      tone(90, 1.2, 'sine', 0.18, 40, 0.05);
    },
    alarm()    { tone(880, 0.18, 'square', 0.14); tone(880, 0.18, 'square', 0.14, null, 0.24); },
    heart()    { tone(70, 0.14, 'sine', 0.24, 50); tone(64, 0.18, 'sine', 0.18, 44, 0.16); },
    loan()     { [440, 466, 392].forEach((f, i) => tone(f, 0.3, 'sine', 0.12, null, i * 0.11)); },
  };
})();

/* ---------------- 涨跌配色 ---------------- */
/**
 * 国际市场惯例：绿涨红跌
 * 东亚（日/中/台）股市惯例：红涨绿跌
 * 用 data-scheme 属性驱动 CSS 变量，JS 侧同步读取。
 */
const Theme = (() => {
  const KEY = 'fxkurumi.scheme';
  const WEST = { up: '#3ddc97', down: '#ff4d6d', name: '绿涨红跌（国际 FX）' };
  const EAST = { up: '#ff4d6d', down: '#3ddc97', name: '红涨绿跌（东亚股市）' };
  // 默认用东亚惯例（红涨绿跌）——《FX战士久留美》是日本作品，
  // 且中文玩家更习惯这套；设置里可切回国际 FX 的绿涨红跌。
  let cur = 'east';
  try { cur = localStorage.getItem(KEY) || 'east'; } catch (e) { cur = 'east'; }

  function apply() {
    try {
      document.documentElement.setAttribute('data-scheme', cur === 'east' ? 'east' : 'west');
    } catch (e) {}
  }
  apply();

  return {
    get current() { return cur; },
    up() { return cur === 'east' ? EAST.up : WEST.up; },
    down() { return cur === 'east' ? EAST.down : WEST.down; },
    /** 根据数值取色 */
    of(v) { return v >= 0 ? this.up() : this.down(); },
    set(id) {
      cur = id === 'east' ? 'east' : 'west';
      try { localStorage.setItem(KEY, cur); } catch (e) {}
      apply();
      return cur;
    },
    toggle() { return this.set(cur === 'east' ? 'west' : 'east'); },
    options() { return [['west', WEST.name], ['east', EAST.name]]; },
    label() { return cur === 'east' ? EAST.name : WEST.name; },
  };
})();

/* ---------------- 本地存储（多槽 + 自动备份 + 元信息） ---------------- */
const Store = (() => {
  'use strict';
  const LEGACY_KEY = 'fxkurumi.save.v2';          // 旧版单槽，读档时自动迁移
  const SLOT_KEY = n => `fxkurumi.save.slot${n}`;
  const META_KEY = 'fxkurumi.save.meta';
  const BACKUP_KEY = 'fxkurumi.save.backup';
  const SLOTS = 3;

  let available = true;
  try {
    localStorage.setItem('__t', '1'); localStorage.removeItem('__t');
  } catch (e) { available = false; }
  const memory = {};

  function rawGet(k) {
    try { return available ? localStorage.getItem(k) : (memory[k] || null); }
    catch (e) { return memory[k] || null; }
  }
  function rawSet(k, v) {
    try {
      if (available) localStorage.setItem(k, v); else memory[k] = v;
      return true;
    } catch (e) {
      // 配额超限：尝试清理备份后再写一次
      try { localStorage.removeItem(BACKUP_KEY); localStorage.setItem(k, v); return true; }
      catch (e2) { memory[k] = v; return false; }
    }
  }

  /** 简易校验，用来发现损坏的存档 */
  function checksum(str) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }

  function readMeta() {
    try { return JSON.parse(rawGet(META_KEY) || '{}'); } catch (e) { return {}; }
  }
  function writeMeta(m) { rawSet(META_KEY, JSON.stringify(m)); }

  return {
    available,
    SLOTS,

    /**
     * 保存到指定槽
     * @param obj 存档负载
     * @param slot 槽位 0..2
     * @param info 显示用元信息 {day, level, netAsset, chapter}
     */
    save(obj, slot, info) {
      slot = slot | 0;
      // 先把上一份内容挪到备份（只在写主槽时做，避免反复复制）
      const prev = rawGet(SLOT_KEY(slot));
      if (prev && prev.length > 200) rawSet(BACKUP_KEY, prev);

      let raw;
      try { raw = JSON.stringify(obj); } catch (e) { return false; }
      const wrapped = JSON.stringify({ cs: checksum(raw), d: raw, t: Date.now() });
      const ok = rawSet(SLOT_KEY(slot), wrapped);

      const m = readMeta();
      m[slot] = Object.assign({}, info || {}, {
        savedAt: Date.now(),
        size: wrapped.length,
        ok,
      });
      writeMeta(m);
      return ok;
    },

    /** 读指定槽；校验失败自动回退备份 */
    load(slot) {
      slot = slot | 0;
      const tryParse = (raw) => {
        if (!raw) return null;
        try {
          const w = JSON.parse(raw);
          if (!w || !w.d) return null;
          if (w.cs && checksum(w.d) !== w.cs) return { __corrupt: true };
          return JSON.parse(w.d);
        } catch (e) { return { __corrupt: true }; }
      };

      let r = tryParse(rawGet(SLOT_KEY(slot)));
      if (r && r.__corrupt) {
        const b = tryParse(rawGet(BACKUP_KEY));
        if (b && !b.__corrupt) return Object.assign(b, { __fromBackup: true });
        return null;
      }
      if (r) return r;

      // 迁移：没有多槽存档时，尝试读旧版单槽
      // 注意：旧格式是「裸 JSON」（没有 {cs,d,t} 包装），不能走 tryParse
      if (slot === 0) {
        const raw = rawGet(LEGACY_KEY);
        if (raw) {
          try {
            const o = JSON.parse(raw);
            if (o && o.st) return Object.assign(o, { __migrated: true });
            // 万一旧版也被包装过
            if (o && o.d) {
              const inner = JSON.parse(o.d);
              if (inner && inner.st) return Object.assign(inner, { __migrated: true });
            }
          } catch (e) { /* 忽略损坏的旧存档 */ }
        }
      }
      return null;
    },

    /** 列出所有槽的元信息（含是否存在、大小、时间） */
    list() {
      const m = readMeta();
      const out = [];
      for (let i = 0; i < SLOTS; i++) {
        let info = m[i] || null;
        if (!info) {
          // 元信息丢了但存档还在？现场补一个
          const raw = rawGet(SLOT_KEY(i));
          if (raw && raw.length > 200) info = { savedAt: null, size: raw.length };
        }
        out.push({ slot: i, info });
      }
      return out;
    },

    /** 哪个槽是当前使用的 */
    get active() {
      const v = rawGet('fxkurumi.save.active');
      return v === null ? 0 : (+v || 0);
    },
    set active(n) { rawSet('fxkurumi.save.active', String(n | 0)); },

    /** 是否存在任何存档 */
    hasAny() {
      for (let i = 0; i < SLOTS; i++) if (rawGet(SLOT_KEY(i))) return true;
      return !!rawGet(LEGACY_KEY);
    },

    remove(slot) {
      try { localStorage.removeItem(SLOT_KEY(slot | 0)); } catch (e) { memory[SLOT_KEY(slot | 0)] = undefined; }
      const m = readMeta(); delete m[slot | 0]; writeMeta(m);
    },

    hasBackup() { return !!rawGet(BACKUP_KEY); },

    clear() {
      for (let i = 0; i < SLOTS; i++) this.remove(i);
      try { localStorage.removeItem(LEGACY_KEY); localStorage.removeItem(BACKUP_KEY); localStorage.removeItem(META_KEY); } catch (e) {}
    },

    /** 导出为可复制的文本 */
    exportString(obj) {
      try { return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); } catch (e) { return ''; }
    },
    importString(s) {
      try { return JSON.parse(decodeURIComponent(escape(atob(String(s).trim())))); } catch (e) { return null; }
    },
    /** 导出为 .json 文本（更通用） */
    exportJson(obj) { try { return JSON.stringify(obj, null, 1); } catch (e) { return ''; } },
  };
})();


/* ===== 02-chart.js ===== */
/* ============================================================
 * 02-chart.js  蜡烛图 / 走势图 / 迷你线 绘制引擎
 * 全部基于 Canvas2D，支持高DPI，逐帧重绘
 * ============================================================ */

/* ---------- 高清画布封装 ---------- */
class Surface {
  constructor(canvas) {
    this.c = canvas;
    this.ctx = canvas.getContext('2d', { alpha: true });
    this.w = 0; this.h = 0; this.dpr = 1;
    this.resize();
  }
  resize() {
    const r = this.c.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const w = Math.max(40, Math.round(r.width)), h = Math.max(30, Math.round(r.height));
    if (w === this.w && h === this.h && dpr === this.dpr) return false;
    this.w = w; this.h = h; this.dpr = dpr;
    this.c.width = Math.round(w * dpr); this.c.height = Math.round(h * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return true;
  }
  clear() { this.ctx.clearRect(0, 0, this.w, this.h); }
  roundRect(x, y, w, h, r) {
    const ctx = this.ctx;
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
}

/* ---------- 主图表 ---------- */
class CandleChart {
  constructor(canvas, opts) {
    this.s = new Surface(canvas);
    this.o = Object.assign({
      up: (typeof Theme !== 'undefined' ? Theme.up() : '#3ddc97'),
      down: (typeof Theme !== 'undefined' ? Theme.down() : '#ff4d6d'),
      grid: 'rgba(255,255,255,0.055)',
      text: 'rgba(226,232,240,0.62)',
      textStrong: '#e2e8f0',
      accent: '#ffd166',
      showMA: true,
      priceDigits: 3,
      padTop: 16, padBottom: 20, padRight: 62, padLeft: 6,
      gap: 0.22
    }, opts || {});
    this.cam = 0;              // 摄像机：右端索引偏移（0 = 最新）
    this.pinch = 1;            // 缩放（1 = 自适应显示 maxBars 根）
    this.maxBars = 90;
    this.px = 0;               // 平滑价格显示
    this.py = 0;
    this.hover = null;         // {i, x, y}
    this.flash = 0;            // 最新价闪动
    this.shock = 0;            // 爆仓抖动
    this.liqLine = null;       // 强平价 {price} 或 null
    this.slLine = null;        // 止损/止盈线数组
    this.marker = 0;           // 持仓方向 0/1/-1
    this.entryLine = null;
    this._last = null;
  }

  /** 计算可见区间 */
  view(bars) {
    const n = bars.length;
    if (!n) return null;
    this.pinch = U.clamp(this.pinch, 0.5, 4);
    let count = Math.round(this.maxBars / this.pinch);
    count = U.clamp(count, 12, Math.max(12, n));
    let end = n - Math.round(this.cam);
    end = U.clamp(end, count, n);
    const start = Math.max(0, end - count);
    return { start, end, count: end - start };
  }

  highLow(bars, v) {
    let hi = -Infinity, lo = Infinity;
    const from = Math.max(0, v.start - 1);
    for (let i = from; i < v.end; i++) {
      if (bars[i].h > hi) hi = bars[i].h;
      if (bars[i].l < lo) lo = bars[i].l;
    }
    if (hi === -Infinity) { hi = 1; lo = 0; }

    /* 强平线 / 入场价只有在「离价格不太远」时才参与 Y 轴范围。
       否则 100 倍杠杆下强平线可能远在几十点之外，
       会把整张图压成一条直线——买入后价格走势完全看不出来。 */
    const span0 = Math.max(1e-9, hi - lo);
    const ref = this.px || hi;
    const far = (v) => v > hi ? v - hi : (v < lo ? lo - v : 0);
    /* 阈值同时看「波动跨度」和「现价的百分比」：
       取两者较大值。这样即使当天波动很小，只要强平线在现价 3% 以内
       （100 倍杠杆下已经非常危险）也会被画出来；
       而远在几十点外的强平线则交给边缘指示，不去压扁走势。 */
    const liqLimit = Math.max(span0 * 0.9, ref * 0.03);
    if (this.liqLine !== null && isFinite(this.liqLine) && far(this.liqLine) <= liqLimit) {
      hi = Math.max(hi, this.liqLine); lo = Math.min(lo, this.liqLine);
    }
    const entryLimit = Math.max(span0 * 2, ref * 0.06);
    if (this.entryLine !== null && isFinite(this.entryLine) && far(this.entryLine) <= entryLimit) {
      hi = Math.max(hi, this.entryLine); lo = Math.min(lo, this.entryLine);
    }
    const pad = (hi - lo) * 0.08 || hi * 0.002 || 0.01;
    return { hi: hi + pad, lo: lo - pad };
  }

  /** 屏幕坐标 <-> 价格 */
  makeScale(v, hl) {
    const o = this.o;
    const x0 = o.padLeft, x1 = this.s.w - o.padRight;
    const y0 = o.padTop, y1 = this.s.h - o.padBottom;
    const bw = (x1 - x0) / v.count;
    const span = hl.hi - hl.lo || 0.0001;
    return {
      x0, x1, y0, y1, bw,
      X: i => x0 + (i - v.start + 0.5) * bw,
      Y: p => y1 - (p - hl.lo) / span * (y1 - y0),
      invY: y => hl.lo + (y1 - y) / (y1 - y0) * span,
      invX: x => v.start + (x - x0) / bw - 0.5
    };
  }

  draw(bars, dt) {
    const s = this.s, o = this.o, ctx = s.ctx;
    s.clear();
    if (!bars || !bars.length) return;
    const v = this.view(bars);
    const hl = this.highLow(bars, v);
    const sc = this.makeScale(v, hl);
    const last = bars[bars.length - 1];
    this.px = this.px === 0 ? last.c : U.instDt(this.px, last.c, dt, 14);
    if (Math.abs(this.px - last.c) > (hl.hi - hl.lo) * 0.008) this.flash = Math.min(1, this.flash + 0.4);
    this.flash = Math.max(0, this.flash - dt * 1.6);

    // ---- 网格 ----
    ctx.save();
    ctx.strokeStyle = o.grid; ctx.lineWidth = 1;
    ctx.font = '10px ui-monospace,SFMono-Regular,Menlo,monospace';
    ctx.fillStyle = o.text;
    const rows = 5;
    for (let i = 0; i <= rows; i++) {
      const y = Math.round(sc.y0 + (sc.y1 - sc.y0) * i / rows) + 0.5;
      ctx.beginPath(); ctx.moveTo(sc.x0, y); ctx.lineTo(sc.x1, y); ctx.stroke();
      const p = sc.invY(y);
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(p.toFixed(o.priceDigits), sc.x1 + 5, y);
    }
    const nvl = 6;
    for (let i = 0; i <= nvl; i++) {
      const idx = Math.round(sc.invX(sc.x0 + (sc.x1 - sc.x0) * i / nvl));
      if (idx < 0 || idx >= bars.length) continue;
      const x = Math.round(sc.X(idx)) + 0.5;
      ctx.beginPath(); ctx.moveTo(x, sc.y0); ctx.lineTo(x, sc.y1); ctx.stroke();
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(bars[idx].label || '', x, sc.y1 + 4);
    }
    ctx.restore();

    // ---- 价格通道（收盘价折线 + 渐变填充）----
    ctx.save();
    ctx.beginPath();
    for (let i = v.start; i < v.end; i++) {
      const x = sc.X(i), y = sc.Y(bars[i].c);
      i === v.start ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    // 最新一根接到平滑价
    ctx.lineTo(sc.X(v.end - 1), sc.Y(this.px));
    const grad = ctx.createLinearGradient(0, sc.y0, 0, sc.y1);
    const up = this.px >= bars[bars.length - 1].o;
    grad.addColorStop(0, up ? 'rgba(61,220,151,0.26)' : 'rgba(255,77,109,0.26)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.lineTo(sc.x1 - 0.5, sc.y1 - 1);
    ctx.lineTo(sc.X(v.start), sc.y1 - 1);
    ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    ctx.restore();

    // ---- 蜡烛 ----
    const bw = Math.max(1.2, sc.bw * (1 - o.gap));
    for (let i = v.start; i < v.end; i++) {
      const b = bars[i];
      const rise = b.c >= b.o;
      const col = rise ? o.up : o.down;
      const x = sc.X(i);
      const yO = sc.Y(b.o), yC = sc.Y(b.c);
      const top = Math.min(yO, yC), bot = Math.max(yO, yC);
      const hh = Math.max(1, bot - top);
      const isLive = (i === bars.length - 1);
      ctx.globalAlpha = isLive ? 1 : 0.92;

      // 影线
      ctx.strokeStyle = col; ctx.lineWidth = Math.max(1, Math.min(2, bw * 0.16));
      ctx.beginPath(); ctx.moveTo(x, sc.Y(b.h)); ctx.lineTo(x, sc.Y(b.l)); ctx.stroke();

      // 实体
      if (bw >= 3) {
        ctx.fillStyle = col;
        s.roundRect(x - bw / 2, top, bw, hh, Math.min(2, bw * 0.28));
        ctx.fill();
        if (isLive && this.flash > 0.02) {
          ctx.globalAlpha = 0.5 * this.flash;
          ctx.shadowColor = col; ctx.shadowBlur = 12;
          ctx.fill(); ctx.shadowBlur = 0;
        }
      } else {
        ctx.fillRect(x - bw / 2, top, Math.max(1, bw), hh);
      }
    }
    ctx.globalAlpha = 1;

    // ---- 均线 ----
    if (o.showMA && bars.length > 5) {
      [[5, 'rgba(255,209,102,0.85)'], [20, 'rgba(140,180,255,0.75)']].forEach(([span, col]) => {
        ctx.strokeStyle = col; ctx.lineWidth = 1.4;
        ctx.beginPath();
        let started = false;
        for (let i = Math.max(span - 1, v.start); i < v.end; i++) {
          let sum = 0;
          for (let k = i - span + 1; k <= i; k++) sum += bars[k].c;
          const x = sc.X(i), y = sc.Y(sum / span);
          started ? ctx.lineTo(x, y) : (ctx.moveTo(x, y), started = true);
        }
        if (started) ctx.stroke();
      });
    }

    // ---- 入场线 / 强平线 ----
    const line = (price, col, label, dash, glow) => {
      if (price === null || !isFinite(price)) return;
      const y = sc.Y(price);
      if (y < sc.y0 - 20 || y > sc.y1 + 20) return;
      ctx.save();
      ctx.setLineDash(dash || []);
      ctx.strokeStyle = col; ctx.lineWidth = glow ? 2 : 1.3;
      if (glow) { ctx.shadowColor = col; ctx.shadowBlur = 10; }
      ctx.beginPath(); ctx.moveTo(sc.x0, y); ctx.lineTo(sc.x1, y); ctx.stroke();
      ctx.restore();
      ctx.font = 'bold 10px ui-sans-serif,system-ui,sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      const tw = ctx.measureText(label).width + 8;
      ctx.fillStyle = col;
      s.roundRect(sc.x0 + 2, y - 14, tw, 13, 3); ctx.fill();
      ctx.fillStyle = '#0b0f16';
      ctx.fillText(label, sc.x0 + 6, y - 3);
      return y;
    };
    line(this.entryLine, 'rgba(255,255,255,0.55)', '入场', [3, 3]);
    if (this.slLine) this.slLine.forEach(sl => line(sl.price, sl.color, sl.label, [5, 4]));
    if (this.liqLine !== null && isFinite(this.liqLine)) {
      const inView = this.liqLine <= hl.hi && this.liqLine >= hl.lo;
      if (inView) {
        const shake = this.shock > 0.01 ? (Math.random() - 0.5) * this.shock * 4 : 0;
        line(this.liqLine + (sc.invY(0) - sc.invY(1)) * shake * 0, '#ff2e5b', '强平线', [], true);
      } else {
        // 远在视野之外：不撑大 Y 轴，改在最近的一侧画指示条
        const below = this.liqLine < hl.lo;
        const yEdge = below ? sc.y1 - 15 : sc.y0 + 15;
        const pct = Math.abs(this.liqLine - this.px) / this.px * 100;
        ctx.save();
        ctx.globalAlpha = 0.92;
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = 'rgba(255,46,91,0.75)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(sc.x0, yEdge); ctx.lineTo(sc.x1, yEdge);
        ctx.stroke();
        ctx.setLineDash([]);
        const tag = (below ? '▼ 强平 ' : '▲ 强平 ') + this.liqLine.toFixed(3) +
                    '（' + (below ? '低 ' : '高 ') + pct.toFixed(1) + '%）';
        ctx.font = '600 10px ui-monospace,SFMono-Regular,Menlo,monospace';
        const tw = ctx.measureText(tag).width + 12;
        const ty = below ? yEdge - 14 : yEdge + 4;
        ctx.fillStyle = 'rgba(255,46,91,0.92)';
        ctx.fillRect(sc.x0 + 6, ty, tw, 14);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillText(tag, sc.x0 + 12, ty + 10.5);
        ctx.restore();
      }
    }

    // ---- 最新价标牌 ----
    const yLast = sc.Y(this.px);
    const upNow = this.px >= (bars[bars.length - 1].o);
    const col = upNow ? o.up : o.down;
    ctx.save();
    ctx.shadowColor = col; ctx.shadowBlur = 8 * (1 + this.flash * 2);
    ctx.fillStyle = col;
    s.roundRect(sc.x1 + 2, yLast - 9, o.padRight - 6, 18, 4); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#08111c';
    ctx.font = 'bold 11px ui-monospace,SFMono-Regular,monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(this.px.toFixed(o.priceDigits), sc.x1 + 6, yLast + 0.5);

    // ---- 十字光标 ----
    if (this.hover) {
      const i = U.clamp(Math.round(this.hover.i), 0, bars.length - 1);
      const b = bars[i], x = sc.X(i), y = sc.Y(b.c);
      ctx.save();
      ctx.setLineDash([3, 3]); ctx.strokeStyle = 'rgba(255,255,255,0.42)';
      ctx.beginPath(); ctx.moveTo(x, sc.y0); ctx.lineTo(x, sc.y1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sc.x0, this.hover.y); ctx.lineTo(sc.x1, this.hover.y); ctx.stroke();
      ctx.restore();
      const txt = `${b.label} 开${b.o.toFixed(o.priceDigits)} 高${b.h.toFixed(o.priceDigits)} 低${b.l.toFixed(o.priceDigits)} 收${b.c.toFixed(o.priceDigits)}`;
      ctx.font = '10px ui-monospace,monospace';
      const w = ctx.measureText(txt).width + 10;
      ctx.fillStyle = 'rgba(8,14,24,0.92)';
      s.roundRect(sc.x0 + 3, sc.y0 + 3, Math.min(w, sc.x1 - sc.x0 - 6), 17, 4); ctx.fill();
      ctx.fillStyle = 'rgba(226,232,240,0.92)';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(txt, sc.x0 + 8, sc.y0 + 12);
    }

    // ---- 爆仓抖动 ----
    if (this.shock > 0.01) {
      const a = this.shock * 0.22;
      ctx.fillStyle = `rgba(255,46,91,${a})`;
      ctx.fillRect(0, 0, s.w, s.h);
      this.shock = Math.max(0, this.shock - dt * 1.1);
    }
  }
}

/* ---------- 迷你走势条（角色面板/摄像头用） ---------- */
function drawSparkline(canvas, values, color, fill) {
  const s = new Surface(canvas);
  const ctx = s.ctx;
  s.clear();
  if (!values || values.length < 2) return;
  let hi = -Infinity, lo = Infinity;
  for (const v of values) { if (v > hi) hi = v; if (v < lo) lo = v; }
  const span = hi - lo || 1;
  const X = i => (i / (values.length - 1)) * (s.w - 2) + 1;
  const Y = v => s.h - 2 - (v - lo) / span * (s.h - 4);
  ctx.beginPath();
  values.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)));
  ctx.strokeStyle = color || '#ffd166'; ctx.lineWidth = 1.6;
  ctx.lineJoin = 'round'; ctx.stroke();
  if (fill !== false) {
    ctx.lineTo(X(values.length - 1), s.h); ctx.lineTo(X(0), s.h); ctx.closePath();
    const g = ctx.createLinearGradient(0, 0, 0, s.h);
    const c = color || '#ffd166';
    g.addColorStop(0, c.replace('rgb', 'rgba').replace(')', ',0.30)'));
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fill();
  }
}

/* ---------- 单品种行情序列 ---------- */
class Series {
  constructor(def, seed) {
    this.def = def;
    this.rnd = U.rngFrom(seed);
    this.bars = [];          // {o,h,l,c,label,day}
    this.tickInBar = 0;
    this.cur = null;         // 正在形成的K线
    this.price = def.price;
    this.regime = 'range';
    this.regimeLeft = 40;
    this.trend = 0;
    this.volMul = 1;
    this.news = null;        // {dir, left, power}
    this.lastTickMove = 0;
    this.rangeHigh = def.price; this.rangeLow = def.price;
    this.dayVol = 1;
    this._seedBars(220);
  }

  _seedBars(n) {
    // 用同一随机过程预热历史，让开局图表就有"历史感"
    for (let i = 0; i < n; i++) {
      const b = { o: this.price, h: this.price, l: this.price, c: this.price, label: '', day: 0 };
      for (let t = 0; t < TICKS_PER_BAR; t++) this._step(b);
      b.o = b.o; this.bars.push(b);
    }
    // 用临时条丢弃，最终 cur 从当前价开始
    this.bars = this.bars.slice(-200);
    this.cur = null;
    this.tickInBar = 0;
    this.bars.forEach((b, i) => { b.label = `${(i % 12) + 1}月${(i % 28) + 1}日`; });
  }

  _step(b) {
    const d = this.def;
    if (this.regimeLeft-- <= 0) {
      const r = this.rnd();
      if (r < 0.36) { this.regime = 'trend'; this.trend = (this.rnd() < 0.5 ? -1 : 1) * (0.35 + this.rnd() * 0.85) * d.vol * 60; }
      else if (r < 0.78) { this.regime = 'range'; this.trend = 0; }
      else { this.regime = 'wild'; this.trend = (this.rnd() < 0.5 ? -1 : 1) * (0.2 + this.rnd() * 0.6) * d.vol * 60; }
      this.regimeLeft = 18 + Math.floor(this.rnd() * 70);
      if (this.regime === 'range') { this.rangeHigh = this.price * (1 + d.vol * 12 * (0.4 + this.rnd())); this.rangeLow = this.price * (1 - d.vol * 12 * (0.4 + this.rnd())); }
    }
    let sigma = d.vol * this.volMul;
    if (this.regime === 'wild') sigma *= 2.6;
    if (this.regime === 'trend') sigma *= 1.25;

    let drift = 0;
    if (this.regime === 'trend') drift = this.trend * 0.006 * this.volMul;
    if (this.regime === 'range') {
      if (this.price > this.rangeHigh) drift = -(this.price - this.rangeHigh) * 0.02;
      else if (this.price < this.rangeLow) drift = (this.rangeLow - this.price) * 0.02;
    }

    // 新闻事件
    if (this.news) {
      drift += this.news.dir * this.news.power * 0.02;
      this.news.left--;
      this.news.power *= 0.985;
      if (this.news.left <= 0) this.news = null;
    }

    const shock = this.rnd() < 0.012 ? U.gauss(this.rnd) * sigma * 5 : 0;
    let dP = drift + U.gauss(this.rnd) * sigma + shock;
    // 极端保护：单刻度不超过 6%
    dP = U.clamp(dP, -this.price * 0.06, this.price * 0.06);
    const np = Math.max(this.def.price * 0.35, this.price + dP);
    this.lastTickMove = np - this.price;
    this.price = np;
    if (this.price > b.h) b.h = this.price;
    if (this.price < b.l) b.l = this.price;
    b.c = this.price;
    return this.lastTickMove;
  }

  tick() {
    if (!this.cur) this.cur = { o: this.price, h: this.price, l: this.price, c: this.price, label: '', day: 0 };
    this._step(this.cur);
    this.tickInBar++;
    if (this.tickInBar >= TICKS_PER_BAR) {
      this.bars.push(this.cur);
      if (this.bars.length > 620) this.bars.shift();
      this.cur = null;
      this.tickInBar = 0;
      return true;   // 新K线成立
    }
    return false;
  }

  /** 图表用的条序列（含正在形成的一根） */
  view() {
    if (!this.cur) return this.bars;
    const c = Object.assign({}, this.cur);
    return this.bars.concat([c]);
  }
  get last() {
    return this.cur ? this.cur.c : (this.bars.length ? this.bars[this.bars.length - 1].c : this.def.price);
  }

  /** Bid / Ask */
  bid() { return this.price; }
  ask() { return this.price + this.def.spread; }

  labelDay(day, barIdx) {
    const dt = U.addDays(2021, 4, 5, day);
    return `${dt.m}/${dt.d}`;
  }
}

/* ---------- 市场总控 ---------- */
class Market {
  constructor(seed) {
    this.seed = seed;
    this.rnd = U.rngFrom(seed ^ 0x9e3779b9);
    this.map = {};
    PAIR_ORDER.forEach((id, i) => { this.map[id] = new Series(PAIRS[id], (seed + i * 7919) >>> 0); });
    this.tickCount = 0;
    this.day = 0;
    this.newsLog = [];
    this.listeners = [];
    this.active = 'USDJPY';
    this.nextNews = 30 + Math.floor(this.rnd() * 60);
    this.lastVolDay = 1;
    this.corr = 0.45;                       // 品种间相关性
    this.liqShock = null;
    this.intervention = 0;                  // 日银警戒度
  }

  on(fn) { this.listeners.push(fn); }
  emit(ev) { this.listeners.forEach(f => { try { f(ev); } catch (e) {} }); }

  pair(id) { return this.map[id || this.active]; }
  ids() { return PAIR_ORDER; }

  tick() {
    const common = U.gauss(this.rnd) * 0.0009;
    const made = [];
    for (const id of PAIR_ORDER) {
      const s = this.map[id];
      if (s.tick()) {
        s.bars.forEach((b, i) => { b.label = `${(i % 12) + 1}/${(i % 28) + 1}`; });
        made.push(id);
      }
      // 相关性：让所有品种共享一小部分冲击
      s.price = Math.max(0.3, s.price + common * s.def.price * this.corr);
      if (s.cur) {
        s.cur.c = s.price;
        if (s.price > s.cur.h) s.cur.h = s.price;
        if (s.price < s.cur.l) s.cur.l = s.price;
      } else if (s.bars.length) {
        const lb = s.bars[s.bars.length - 1];
        lb.c = s.price; lb.h = Math.max(lb.h, s.price); lb.l = Math.min(lb.l, s.price);
      }
    }
    this.tickCount++;
    if (this.tickCount % TICKS_PER_BAR === 0) { /* 每根K线一个小区间 */ }
    if (this.tickCount % TICKS_PER_DAY === 0) {
      this.day++;
      this.dayNews();
      this.maybeBlackSwan();
    }
    if (this.swan) {
      this.swan.left--;
      if (this.swan.left <= 0) this.swan = null;
    }
    // 预定新闻
    if (--this.nextNews <= 0) {
      this.fireNews();
      this.nextNews = 22 + Math.floor(this.rnd() * 70);
    }
    return { made, day: this.day };
  }

  /* ===== 黑天鹅 ===== */
  /**
   * 每天判定一次是否触发黑天鹅（默认 4.5%）。
   * 触发时：相关品种瞬间跳空 + 点差暴涨，持续 dur 个 tick。
   */
  maybeBlackSwan() {
    if (this.swan) return null;                      // 已有事件在生效
    if (this.rnd() > 0.045) return null;
    const ev = BLACK_SWAN[Math.floor(this.rnd() * BLACK_SWAN.length)];
    const mag = ev.jump[0] + this.rnd() * (ev.jump[1] - ev.jump[0]);
    const hit = [];
    for (const id of ev.pairs) {
      const s = this.map[id];
      if (!s) continue;
      // 按比例跳空（直接改价格，不经过正常波动）
      const from = s.price;
      s.price = Math.max(0.3, s.price * (1 + mag));
      if (s.cur) {
        s.cur.c = s.price;
        s.cur.h = Math.max(s.cur.h, from);
        s.cur.l = Math.min(s.cur.l, s.price);
      } else if (s.bars.length) {
        const lb = s.bars[s.bars.length - 1];
        lb.c = s.price;
        lb.h = Math.max(lb.h, from);
        lb.l = Math.min(lb.l, s.price);
      }
      hit.push({ id, from, to: s.price, pct: (s.price / from - 1) * 100 });
    }
    this.swan = {
      ev, mag, hit, left: ev.dur,
      spreadMul: ev.spreadMul || 4,
      atDay: this.day,
    };
    return this.swan;
  }

  /** 黑天鹅剩余 tick */
  swanLeft() { return this.swan ? this.swan.left : 0; }

  /** 当前点差倍率（黑天鹅期间放大） */
  spreadMulNow() { return this.swan ? (this.swan.spreadMul || 4) : 1; }

  dayNews() {
    // 每日隔夜利息已由 lever 结算；这里处理周末跳空与波动率
    const r = this.rnd();
    this.lastVolDay = 0.7 + r * 1.1;
    if (r > 0.90) {
      // 周一跳空
      for (const id of PAIR_ORDER) {
        const s = this.map[id];
        const gapBp = (this.rnd() < 0.5 ? -1 : 1) * (0.3 + this.rnd() * 1.4) * s.def.vol * 22;
        s.price = Math.max(0.5, s.price * (1 + gapBp));
        if (s.cur) { s.cur.c = s.price; s.cur.h = Math.max(s.cur.h, s.price); s.cur.l = Math.min(s.cur.l, s.price); }
      }
      this.emit({ type: 'gap' });
    }
  }

  fireNews() {
    const n = NEWS_POOL[Math.floor(this.rnd() * NEWS_POOL.length)];
    const targets = n.pairs.slice();
    const isCrash = n.tag === 'crash';
    const isBear = n.tag === 'bear';
    const item = { t: n.t, tag: n.tag, dt: this.day, id: ++idCounter, focus: targets[0] };
    for (const id of targets) {
      const s = this.map[id];
      const mag = n.mag[0] + this.rnd() * (n.mag[1] - n.mag[0]);
      let dir = isCrash ? (this.rnd() < 0.62 ? -1 : 1) : (n.tag === 'bear' ? -1 : 1);
      // 日银警戒：极端弱日元会招来更猛烈的反向冲击
      if (s.price > s.def.price * 1.14 && dir > 0) this.intervention += 0.2;
      const power = dir * mag * s.def.vol * 30 * (isCrash ? 1.5 : 1);
      s.news = { dir, power: power * 12, left: n.dur, mag, tag: n.tag };
      // 立即一次跳空
      const jump = dir * mag * s.def.vol * 9;
      s.price = Math.max(0.5, s.price + jump);
      if (s.cur) { s.cur.c = s.price; s.cur.h = Math.max(s.cur.h, s.price); s.cur.l = Math.min(s.cur.l, s.price); }
    }
    this.newsLog.unshift(item);
    if (this.newsLog.length > 40) this.newsLog.pop();
    this.emit({ type: 'news', news: item });
    if (isCrash) this.emit({ type: 'crash' });
  }

  /** 久留美式黑色幽默：主角持仓达到一定规模时会遭遇逆风 */
  nudgeAgainst(dir, strength) {
    const s = this.pair();
    s.news = { dir: -dir, power: s.def.vol * 22 * strength, left: 20, mag: strength, tag: 'scripted' };
    const jump = -dir * s.def.vol * 4 * strength;
    s.price = Math.max(0.5, s.price + jump);
    if (s.cur) { s.cur.c = s.price; s.cur.h = Math.max(s.cur.h, s.price); s.cur.l = Math.min(s.cur.l, s.price); }
    this.emit({ type: 'scripted', dir: -dir });
  }

  /**
   * 紧凑序列化：存档体积从 ~147KB 压到 ~20KB
   *  · 价格整数化（×1000 保留 3 位小数），浮点数不再存 15 位
   *  · K 线只留最近 120 根（图表够用），且用 [o,h,l,c] 数组而非对象
   *  · 不存 label，恢复时按索引重建
   */
  serialize() {
    const KEEP = 120;
    const ip = v => Math.round(v * 1000);
    const o = {
      v: 2,                                   // 序列化格式版本
      seed: this.seed, tickCount: this.tickCount, day: this.day,
      nextNews: this.nextNews, active: this.active, pairs: {},
    };
    for (const id of PAIR_ORDER) {
      const s = this.map[id];
      const bars = s.bars.slice(-KEEP).map(b => [ip(b.o), ip(b.h), ip(b.l), ip(b.c)]);
      o.pairs[id] = {
        p: ip(s.price),
        rg: s.regime, tr: Math.round(s.trend * 1e6), rl: s.regimeLeft,
        b: bars, tib: s.tickInBar,
        cur: s.cur ? [ip(s.cur.o), ip(s.cur.h), ip(s.cur.l), ip(s.cur.c)] : null,
        rh: ip(s.rangeHigh), rlo: ip(s.rangeLow),
      };
    }
    return o;
  }
  restore(o) {
    if (!o) return;
    this.tickCount = o.tickCount; this.day = o.day;
    this.nextNews = o.nextNews; this.active = o.active || this.active;
    const dp = v => v / 1000;
    const rebuildLabel = (bars) => bars.forEach((b, i) => {
      b.label = `${(i % 12) + 1}/${(i % 28) + 1}`;
    });

    for (const id in o.pairs) {
      const s = this.map[id]; if (!s) continue;
      const p = o.pairs[id];
      if (o.v === 2) {
        // ---- 新紧凑格式 ----
        s.price = dp(p.p);
        s.regime = p.rg; s.trend = p.tr / 1e6; s.regimeLeft = p.rl;
        s.bars = (p.b || []).map(a => ({ o: dp(a[0]), h: dp(a[1]), l: dp(a[2]), c: dp(a[3]), label: '' }));
        rebuildLabel(s.bars);
        s.tickInBar = p.tib || 0;
        s.cur = p.cur ? { o: dp(p.cur[0]), h: dp(p.cur[1]), l: dp(p.cur[2]), c: dp(p.cur[3]), label: '', day: 0 } : null;
        s.rangeHigh = dp(p.rh); s.rangeLow = dp(p.rlo);
      } else {
        // ---- 旧格式（向后兼容）----
        s.price = p.price; s.regime = p.regime; s.trend = p.trend; s.regimeLeft = p.regimeLeft;
        s.bars = p.bars || s.bars; s.tickInBar = p.tickInBar; s.cur = p.cur;
        s.rangeHigh = p.rh || s.rangeHigh; s.rangeLow = p.rl || s.rangeLow;
        rebuildLabel(s.bars);
      }
    }
  }
}
