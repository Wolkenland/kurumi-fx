/* ---------- 核心 ---------- */
class Core {
  constructor() {
    this.agent = false;            // true = 这是一个 AI 玩家，不发声、不存档、不弹窗
    this.slot = 0;                 // 当前存档槽（0..2）
    this.st = initialState();
    this.market = new Market(this.st.seed);
    // 第一天也要有任务（否则要等到第二天 newDay 才生成）
    if (!Array.isArray(this.st.dailyTasks) || !this.st.dailyTasks.length) {
      this.genDailyTasks();
    }
    this.timers = U.makeTimers();
    this.tickMs = 700;
    this.acc = 0;
    this.running = false;
    this.daySwapDone = -1;
    this.listeners = [];
    this.pendingEvents = [];
    this.barkCool = 0;
    this.recentPnl = 0;       // 用于判定"刚赚/刚亏"的对白
    this.marginCall = null;   // {level:1|2}
    this.mochiko = { mood: 'idle', watched: 0 };
  }

  /* ===== 表现层守卫（AI 玩家不该触发玩家的音效/震动）===== */
  fx(name) { if (this.agent) return; try { Sfx[name].apply(Sfx, [].slice.call(arguments, 1)); } catch (e) {} }
  hap(name) { if (this.agent) return; try { Haptics[name].apply(Haptics, [].slice.call(arguments, 1)); } catch (e) {} }

  /* ===== 永久技能（洞察点购买）===== */

  /** 1 点洞察能兑换多少钱（日元） */
  static get INSIGHT_RATE() { return 100000; }
  insightRate() { return 100000; }

  /** 点差倍率：交易成本减免 Lv1-3 → 0.9 / 0.8 / 0.7 */
  spreadMul() { return 1 - 0.1 * (this.st.perks.fees || 0); }
  /** 某品种的实际点差 */
  spreadOf(pid) {
    // 黑天鹅期间点差会暴涨——这是真实市场里最先失控的东西
    const swanMul = this.market.spreadMulNow ? this.market.spreadMulNow() : 1;
    return this.market.pair(pid).def.spread * this.spreadMul() * swanMul;
  }

  /** 爆仓保险返还比例 */
  rebateRate() { return 0.1 * (this.st.perks.rebate || 0); }

  /** 信用力：借贷额度上限倍率（每级 +25%） */
  loanLimitMul() { return 1 + 0.25 * (this.st.perks.credit || 0); }
  /** 某借贷渠道的实际可借上限 */
  loanLimit(def) { return Math.round(def.limit * this.loanLimitMul()); }

  /**
   * 利息谈判：隔夜利息改善倍率
   * @param dir +1 表示收利息（放大），-1 表示付利息（缩小）
   */
  swapMul(dir) {
    const lv = this.st.perks.swap || 0;
    return dir >= 0 ? 1 + 0.3 * lv : 1 - 0.3 * lv;
  }

  /** 胆力：精神损失倍率（每级 -40%，最低 20%） */
  mentalLossMul() { return Math.max(0.2, 1 - 0.4 * (this.st.perks.guts || 0)); }

  /* ---- 技能定义表 ---- */
  static get PERK_MAX() {
    return { fees: 3, rebate: 3, intel: 2, credit: 3, swap: 3, guts: 2 };
  }
  static get PERK_COST() {
    return {
      fees:   { 1: 3, 2: 6, 3: 10 },
      rebate: { 1: 3, 2: 6, 3: 10 },
      intel:  { 1: 3, 2: 6 },
      credit: { 1: 4, 2: 8, 3: 14 },
      swap:   { 1: 3, 2: 7, 3: 12 },
      guts:   { 1: 3, 2: 6 },
    };
  }

  perkCost(key, level) {
    const row = Core.PERK_COST[key];
    return (row && row[level]) || 99;
  }
  perkMax(key) { return Core.PERK_MAX[key] || 3; }

  buyPerk(key) {
    const cur = this.st.perks[key] || 0;
    if (cur >= this.perkMax(key)) return { ok: false, why: '已经满级了' };
    const cost = this.perkCost(key, cur + 1);
    if (this.st.insightPts < cost) return { ok: false, why: `需要 ${cost} 点洞察（你有 ${this.st.insightPts}）` };
    this.st.insightPts -= cost;
    this.st.perks[key] = cur + 1;
    this.fx('bigwin'); this.hap('win');
    this.pushLog('perk', `技能升级：${key} Lv.${cur + 1}`, 0);
    this.emit('perk', { key, level: cur + 1 });
    this.save();
    return { ok: true, level: cur + 1 };
  }

  /* ===== 洞察点 ↔ 金钱 ===== */
  /** 1 点洞察 = 10 万円，兑到的钱进钱包（可自由决定是否入金） */
  exchangeInsight(points) {
    const n = Math.floor(points);
    if (!(n > 0)) return { ok: false, why: '兑换点数必须是正整数' };
    if (this.st.insightPts < n) return { ok: false, why: `洞察点不足（你有 ${this.st.insightPts} 点）` };
    const money = n * this.insightRate();
    this.st.insightPts -= n;
    this.st.wallet += money;
    this.fx('coin'); this.hap('win');
    this.pushLog('exchange', `洞察兑换：${n} 点 → ${U.fmt(money)} 円`, money);
    this.emit('exchange', { points: n, money });
    this.save();
    return { ok: true, points: n, money };
  }

  addInsight(n, why) {
    this.st.insightPts += n;
    this.emit('insight', { n, why, total: this.st.insightPts });
    return this.st.insightPts;
  }

  /* ===== 每日任务 ===== */
  /** 抽 3 个当日任务（尽量同时包含即时型与结算型） */
  genDailyTasks(rng, nowMs) {
    const r = typeof rng === 'function' ? rng : Math.random;
    const base = typeof nowMs === 'number' ? nowMs : Date.now();
    const instant = DAILY_TASKS.filter(t => t.when === 'instant');
    const settle = DAILY_TASKS.filter(t => t.when === 'settle');
    const pick = (arr, n) => {
      const a = arr.slice();
      const out = [];
      while (out.length < n && a.length) out.push(a.splice(Math.floor(r() * a.length), 1)[0]);
      return out;
    };
    const chosen = pick(instant, 2).concat(pick(settle, 1));
    this.st.dailyTasks = chosen.map(t => t.id);
    this.st.dailyDoneIds = [];
    this.st.dailyAllDone = false;
    this.st.dailyStat = { closed: 0, pnl: 0, liquidated: 0, borrowed: 0, repaid: 0,
                          bestWin: 0, deposited: 0, pairsToday: 0 };
    const cycMs = this.st.dailyCycleMs || (15 * 60 * 1000);
    this.st.dailyEndAt = base + cycMs;
    // 兼容旧字段（老存档里可能还有）
    this.st.dailyStartDay = this.st.date.day;
    this.st.dailyEndDay = 0;
    return chosen;
  }

  /**
   * 限时任务是否到期（按现实时间）。
   * 到期就结算上一轮并开新一轮。可在 tick 里高频调用，开销只有一次比较。
   * @returns true 表示刚刚刷新了
   */
  checkDailyExpiry(now) {
    if (this.agent) return false;
    const t = now || Date.now();
    const st = this.st;
    if (!Array.isArray(st.dailyTasks) || !st.dailyTasks.length) {
      this.genDailyTasks();
      return true;
    }
    if (!st.dailyEndAt) {
      // 老存档迁移：给它一个从现在开始的完整轮次
      const cyc = st.dailyCycleMs || (15 * 60 * 1000);
      st.dailyEndAt = t + cyc;
      return false;
    }
    if (t < st.dailyEndAt) return false;
    // 到点：先结算（结算型任务看整轮累计），再开新一轮
    this.checkDaily('settle');
    st.dailyRound = (st.dailyRound || 0) + 1;
    this.genDailyTasks(null, t);
    this.emit('dailyRound', { round: st.dailyRound });
    return true;
  }

  /** 本轮剩余毫秒 */
  dailyRemainMs(now) {
    const t = now || Date.now();
    const end = this.st.dailyEndAt || 0;
    return Math.max(0, end - t);
  }

  /** 取任务定义 */
  dailyDef(id) { return DAILY_TASKS.find(t => t.id === id) || null; }

  /**
   * 检查任务完成
   * @param phase 'instant' 只查即时型；'settle' 结算当天（两类都查）
   */
  checkDaily(phase) {
    if (this.agent) return [];
    const st = this.st;
    if (!Array.isArray(st.dailyTasks) || !st.dailyTasks.length) return [];
    st.dailyDoneIds = st.dailyDoneIds || [];
    const got = [];
    for (const id of st.dailyTasks) {
      if (st.dailyDoneIds.indexOf(id) >= 0) continue;
      const def = this.dailyDef(id);
      if (!def) continue;
      if (phase === 'instant' && def.when !== 'instant') continue;
      let prog = 0;
      try { prog = def.prog(this) || 0; } catch (e) { prog = 0; }
      if (prog >= def.goal) {
        st.dailyDoneIds.push(id);
        st.insightPts += def.pts;
        st.dailyClaimed = (st.dailyClaimed || 0) + 1;
        got.push({ def, pts: def.pts });
      }
    }
    // 全部完成
    if (!st.dailyAllDone && st.dailyDoneIds.length >= st.dailyTasks.length) {
      st.dailyAllDone = true;
      st.insightPts += DAILY_ALL_BONUS;
      got.push({ def: { name: '今日全清', pts: DAILY_ALL_BONUS }, pts: DAILY_ALL_BONUS, bonus: true });
    }
    if (got.length) {
      this.fx('coin'); this.hap('win');
      got.forEach(g => this.pushLog('daily', `每日任务：${g.def.name}（+${g.pts} 洞察）`, 0));
      this.emit('daily', { list: got });
    }
    return got;
  }

  /** 今日任务进度（供界面） */
  dailyProgress() {
    const st = this.st;
    if (!Array.isArray(st.dailyTasks) || !st.dailyTasks.length) return [];
    return st.dailyTasks.map(id => {
      const def = this.dailyDef(id);
      if (!def) return null;
      let prog = 0;
      try { prog = def.prog(this) || 0; } catch (e) { prog = 0; }
      return {
        id, name: def.name, desc: def.desc, pts: def.pts, when: def.when,
        goal: def.goal, prog: Math.min(prog, def.goal),
        done: (st.dailyDoneIds || []).indexOf(id) >= 0,
      };
    }).filter(Boolean);
  }

  /* ===== 结局 ===== */
  /** 检查是否达成某个结局。触发后记录，不重复弹。 */
  checkEndings() {
    if (this.agent) return null;
    if (!Array.isArray(this.st.endingsSeen)) this.st.endingsSeen = [];
    for (const e of ENDINGS) {
      if (this.st.endingsSeen.indexOf(e.id) >= 0) continue;
      let ok = false;
      try { ok = !!e.cond(this); } catch (err) { ok = false; }
      if (ok) {
        this.st.endingsSeen.push(e.id);
        this.fx('bigwin'); this.hap('win');
        this.pushLog('ending', `结局：${e.title}`, 0);
        this.emit('ending', { ending: e });
        return e;
      }
    }
    return null;
  }

  /* ===== 成就 ===== */
  hasAch(id) { return this.st.achievements.indexOf(id) >= 0; }

  /** 检查并解锁成就，返回本次新解锁的列表 */
  checkAchievements() {
    if (this.agent) return [];
    if (!Array.isArray(this.st.achievements)) this.st.achievements = [];
    const got = [];
    for (const a of ACHIEVEMENTS) {
      if (this.hasAch(a.id)) continue;
      let ok = false;
      try { ok = !!a.test(this); } catch (e) { ok = false; }
      if (ok) {
        this.st.achievements.push(a.id);
        this.st.insightPts += a.pts;
        got.push(a);
      }
    }
    if (got.length) {
      this.fx('bigwin'); this.hap('win');
      got.forEach(a => this.pushLog('ach', `成就解锁：${a.name}（+${a.pts} 洞察）`, 0));
      this.emit('achievement', { list: got });
    }
    return got;
  }

  /** 成就进度（用于界面展示） */
  achSummary() {
    const total = ACHIEVEMENTS.length;
    const done = (this.st.achievements || []).length;
    const byCat = {};
    for (const k in ACH_CATS) byCat[k] = { done: 0, total: 0 };
    for (const a of ACHIEVEMENTS) {
      byCat[a.cat].total++;
      if (this.hasAch(a.id)) byCat[a.cat].done++;
    }
    return { total, done, byCat };
  }

  /* ===== 事件总线 ===== */
  on(fn) { this.listeners.push(fn); }
  emit(type, data) {
    const ev = Object.assign({ type, at: this.st.date }, data || {});
    for (const f of this.listeners) { try { f(ev); } catch (e) {} }
    return ev;
  }

  /* ===== 存档（多槽 + 备份 + 元信息） ===== */
  save() {
    if (this.agent) return false;   // AI 的账户由主存档统一序列化
    const payload = {
      v: 2,
      st: this.st,
      market: this.market.serialize(),
      mochiko: this.mochiko,
      savedAt: Date.now(),
    };
    const info = {
      day: this.st.date.day,
      level: this.st.stats.level,
      netAsset: Math.round(this.netAsset()),
      cash: Math.round(this.st.cash),
      loan: Math.round(this.totalLoan()),
      chapter: this.st.chapter || 0,
      positions: this.st.positions.length,
    };
    return Store.save(payload, this.slot, info);
  }

  /**
   * 读档
   * @param slot 不传则读「上次使用的槽」
   * @returns {ok, fromBackup?, migrated?}
   */
  load(slot) {
    const want = slot === undefined ? Store.active : (slot | 0);
    const o = Store.load(want);
    if (!o || !o.st) return { ok: false };
    this.slot = want;
    Store.active = want;
    this.st = U.merge(initialState(), o.st);
    this.market = new Market(this.st.seed);
    this.market.restore(o.market);
    this.mochiko = o.mochiko || { mood: 'idle', watched: 0 };
    return {
      ok: true,
      fromBackup: !!o.__fromBackup,
      migrated: !!o.__migrated,
      savedAt: o.savedAt || null,
    };
  }

  /** 切换存档槽（不读档，只是后续保存写到新槽） */
  useSlot(n) {
    this.slot = n | 0;
    Store.active = this.slot;
  }

  reset() { Store.clear(); this.st = initialState(); this.market = new Market(this.st.seed); this.slot = 0; }

  /* ===== 时间推进 ===== */
  start() {
    if (this.running) return;
    this.running = true;
    this.lastT = performance.now();
    const loop = () => {
      if (!this.running) return;
      const now = performance.now();
      const dt = Math.min(250, now - this.lastT);
      this.lastT = now;
      if (this.st.speed > 0) {
        this.acc += dt * this.st.speed;
        let guard = 0;
        while (this.acc >= this.tickMs && guard++ < 24) { this.acc -= this.tickMs; this.tick(); }
      } else { this.acc = 0; }
      this.emit('frame', { dt });
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }
  stop() { this.running = false; if (this.raf) cancelAnimationFrame(this.raf); }

  tick() {
    const res = this.market.tick();
    this.st.date.tick++;
    if (this.st.date.tick % TICKS_PER_DAY === 0) {
      this.st.date.day++;
      this.st.date.tick = 0;
      this.newDay();
    }
    this.checkRisk();
    this.checkDailyExpiry();
    if (this.st.speed > 0) this.emit('tick', res);
  }

  newDay() {
    const d = this.st.date.day;
    this.st.stats.daysPlayed = d;

    // 限时任务按现实时间轮转，与游戏内「天」无关，这里不处理。
    // （原来按游戏天刷新，1 倍速下 24 秒就换一轮，玩家来不及完成）
    // 隔夜利息（周三三倍）
    let swap = 0;
    const mult = (d % 7 === 2) ? 3 : (d % 7 === 5 || d % 7 === 6 ? 0 : 1);
    for (const p of this.st.positions) {
      const s = this.market.pair(p.pid);
      const rate = p.dir > 0 ? s.def.swapL : s.def.swapS;
      // 利息谈判：收利息放大、付利息缩小
      const v = p.units * s.def.price * rate * mult * this.swapMul(rate >= 0 ? 1 : -1);
      swap += v;
    }
    // 黑天鹅播报
    if (this.market.swan && !this.agent) {
      const sw = this.market.swan;
      this.pushLog('swan', sw.ev.head, 0);
      this.emit('blackswan', {
        ev: sw.ev, hit: sw.hit,
        spreadMul: sw.spreadMul,
      });
      this.fx('error'); this.hap('lose');
    }
    this.st.swapToday = swap;
    this.st.cash += swap;
    if (Math.abs(swap) > 1) this.emit('swap', { amount: swap, mult });

    // 利息累积
    this.accrueInterest(d);

    // 状态衰减
    this.st.stats.mental = U.clamp(this.st.stats.mental + (this.hasPosition() ? -0.4 : 0.8), 0, 100);
    this.st.stats.greed = U.clamp(this.st.stats.greed - 0.5, 0, 100);

    this.emit('newday', { day: d });
    this.checkAchievements();
    this.checkEndings();
    this.save();
  }

  /* ===== 账号指标 ===== */
  totalLoan() { return this.st.loans.reduce((a, b) => a + b.amount, 0); }
  evalPrice(pos) { const s = this.market.pair(pos.pid); return pos.dir > 0 ? s.bid() : s.ask(); }
  unrealized(pos) { return (this.evalPrice(pos) - pos.entry) * pos.dir * pos.units; }
  unrealizedAll() { return this.st.positions.reduce((a, p) => a + this.unrealized(p), 0); }
  usedMargin() {
    let m = 0;
    for (const p of this.st.positions) {
      const s = this.market.pair(p.pid);
      m += p.units * (p.entry / p.lev);
    }
    return m;
  }
  equity() { return this.st.cash + this.unrealizedAll(); }
  freeMargin() { return this.equity() - this.usedMargin(); }
  marginRate() { const u = this.usedMargin(); return u <= 0 ? Infinity : this.equity() / u * 100; }
  hasPosition() { return this.st.positions.length > 0; }
  netAsset() { return this.st.cash + this.st.wallet + this.unrealizedAll() - this.totalLoan(); }

  /* ===== 下单 ===== */
  canOpen(units, lev, pid) {
    if (units <= 0) return { ok: false, why: '数量无效' };
    if (this.st.cash <= 0) return { ok: false, why: '保证金不足' };
    return { ok: true };
  }

  /**
   * 开仓
   * @param pid 货币对
   * @param dir +1 买(做多) / -1 卖(做空)
   * @param units 通貨量（1 = 1通貨；游戏里按「万通貨」输入）
   * @param lev 杠杆倍率
   */
  open(pid, dir, units, lev) {
    if (units <= 0) return { ok: false, why: '数量必须是正数' };
    if (units > 5000000) return { ok: false, why: '这已经超出任何券商的限度了' };
    const s = this.market.pair(pid);
    const entry = dir > 0 ? s.ask() : s.bid();
    const margin = units * entry / lev;
    if (margin > this.st.cash) {
      this.fx('error'); this.hap('lose');
      return { ok: false, why: `必要保证金的 ${U.fmt(Math.ceil(margin))} 円 不足（可用 ${U.fmt(Math.floor(this.st.cash))} 円）` };
    }
    const pos = {
      id: ++posSeq, pid, dir, units, lev, entry,
      openDay: this.st.date.day, openTick: this.st.date.tick,
      margin, sl: null, tp: null, opened: performance.now(),
    };
    this.st.positions.push(pos);
    this.st.cash -= margin;
    // —— 统计埋点 ——
    const st2 = this.st.stats;
    st2.opened = (st2.opened || 0) + 1;
    st2.pairsTried = st2.pairsTried || {};
    st2.pairsTried[pid] = true;
    st2.maxLev = Math.max(st2.maxLev || 1, lev);
    if (lev === 1) st2.usedLev1 = true;
    st2.maxPositions = Math.max(st2.maxPositions || 0, this.st.positions.length + 1);
    const DS2 = this.st.dailyStat;
    if (DS2) {
      if (!DS2._pairs) DS2._pairs = {};
      DS2._pairs[pid] = true;
      DS2.pairsToday = Object.keys(DS2._pairs).length;
    }
    this.st.stats.greed = U.clamp(this.st.stats.greed + (lev >= 25 ? 2.5 : lev >= 10 ? 1.2 : 0.4), 0, 100);
    this.pushLog(dir > 0 ? 'buy' : 'sell', `${s.def.short} ${dir > 0 ? '买' : '卖'} ${U.fmt(units)}通貨 ×${lev}倍`, 0);
    this.fx('buy'); this.hap('press');
    this.emit('open', { pos });
    this.checkAchievements();
    this.checkDaily('instant');
    this.save();
    return { ok: true, pos };
  }

  /** 平仓（部分平仓 amount 为通貨量，默认全部） */
  close(posId, units) {
    const i = this.st.positions.findIndex(p => p.id === posId);
    if (i < 0) return { ok: false, why: '持仓不存在' };
    const p = this.st.positions[i];
    const s = this.market.pair(p.pid);
    const n = U.clamp(units || p.units, 1, p.units);
    const exit = p.dir > 0 ? s.bid() : s.ask();
    const pnl = (exit - p.entry) * p.dir * n;
    const swap = 0;
    const marginBack = p.units * (p.entry / p.lev) * (n / p.units);
    this.st.cash += marginBack + pnl;
    this.st.stats.totalPnl += pnl;
    this.recentPnl = pnl;
    const S = this.st.stats;
    S.trades = (S.trades || 0) + 1;
    if (pnl > 0) {
      S.wins++; S.streak = Math.max(1, S.streak + 1);
      S.maxStreak = Math.max(S.maxStreak || 0, S.streak);
    } else {
      S.losses++; S.streak = Math.min(-1, S.streak - 1);
    }
    // 回撤记录
    const eq = this.equity();
    S.peakEquity = Math.max(S.peakEquity || eq, eq);
    if (S.peakEquity > 0) {
      const dd = (1 - eq / S.peakEquity) * 100;
      S.maxDrawdown = Math.max(S.maxDrawdown || 0, dd);
    }
    // 每日任务统计
    const DS = this.st.dailyStat;
    if (DS) {
      if (!DS._pairs) DS._pairs = {};
      DS.closed = (DS.closed || 0) + 1;
      DS.pnl = (DS.pnl || 0) + pnl;
      if (pnl > (DS.bestWin || 0)) DS.bestWin = pnl;
      DS._pairs[p.pid] = true;
      DS.pairsToday = Object.keys(DS._pairs).length;
    }
    // 分品种统计
    if (!S.byPair) S.byPair = {};
    const bp = S.byPair[p.pid] || (S.byPair[p.pid] = { n: 0, pnl: 0, wins: 0 });
    bp.n++; bp.pnl += pnl; if (pnl > 0) bp.wins++;
    // 持仓时长
    if (p.openedAt) {
      S.holdMs = (S.holdMs || 0) + Math.max(0, Date.now() - p.openedAt);
      S.holdCount = (S.holdCount || 0) + 1;
    }
    if (pnl > this.st.stats.bestProfit) this.st.stats.bestProfit = pnl;
    if (pnl < this.st.stats.worstLoss) this.st.stats.worstLoss = pnl;

    // 经验与洞察
    const xp = Math.round(Math.min(60, Math.abs(pnl) / 5000 + 3));
    this.addXp(xp, pnl > 0 ? '成功平仓' : '学习总是昂贵的');

    const rec = { pid: p.pid, dir: p.dir, units: n, entry: p.entry, exit, pnl, day: this.st.date.day,
                  lev: p.lev, reason: 'manual' };
    this.st.closed.unshift(rec);
    if (this.st.closed.length > 200) this.st.closed.pop();
    if (n >= p.units) this.st.positions.splice(i, 1);
    else p.units -= n;

    this.pushLog(pnl >= 0 ? 'win' : 'close', `${s.def.short} 平仓 ${U.fmt(n)}通貨`, pnl);
    // 心理变化
    if (pnl > 0) { this.st.stats.mental = U.clamp(this.st.stats.mental + 1.5, 0, 100); this.fx('coin'); }
    else { this.st.stats.mental = U.clamp(this.st.stats.mental - Math.min(12, Math.abs(pnl) / 20000 + 2), 0, 100); this.fx('lose'); }
    this.hap('tap');
    this.emit('close', { rec, pnl });
    this.checkAchievements();
    this.checkDaily('instant');
    this.checkEndings();
    this.save();
    return { ok: true, pnl, rec };
  }

  closeAll(reason) {
    let total = 0;
    const list = this.st.positions.slice();
    for (const p of list) {
      const r = this.close(p.id, p.units);
      if (r.ok) total += r.pnl;
    }
    return total;
  }

  /** 全部平仓但用于风控（强平） */
  liquidate(p, why) {
    const s = this.market.pair(p.pid);
    const exit = p.dir > 0 ? s.bid() : s.ask();
    const pnl = (exit - p.entry) * p.dir * p.units;
    const marginBack = p.units * (p.entry / p.lev);
    this.st.cash += marginBack + pnl;
    this.st.stats.totalPnl += pnl;
    this.st.stats.mental = U.clamp(this.st.stats.mental - 18 * this.mentalLossMul(), 0, 100);
    this.st.stats.liquidated++;
    if (this.st.dailyStat) this.st.dailyStat.liquidated = (this.st.dailyStat.liquidated || 0) + 1;
    this.checkAchievements();
    if (pnl < this.st.stats.worstLoss) this.st.stats.worstLoss = pnl;
    const i = this.st.positions.indexOf(p);
    if (i >= 0) this.st.positions.splice(i, 1);
    const rec = { pid: p.pid, dir: p.dir, units: p.units, entry: p.entry, exit, pnl, day: this.st.date.day,
                  lev: p.lev, reason: why || 'liquidated' };
    this.st.closed.unshift(rec);
    this.pushLog('liq', `${PAIRS[p.pid].short} 強制ロスカット`, pnl);
    return rec;
  }

  /* ===== 风控：追证 / 强制平仓 ===== */
  /**
   * 某货币对的爆仓价（维持率 50% 时）
   * 注意：维持率用的是【账户全部净值】÷【全部必要保证金】，
   * 所以同一个账户里其它货币对的浮盈浮亏，也会把你推下悬崖。
   * 而闲置现金会缓冲爆仓——这就是为什么"钱多反而爆得慢"，
   * 也正是为什么借钱加仓的人会死得特别快（一爆就全没了）。
   */
  liqPriceFor(pid, eqOverride, marginOverride, extraUnits) {
    const s = this.market.pair(pid);
    const ps = this.st.positions.filter(p => p.pid === pid);
    let units = ps.reduce((a, p) => a + p.units, 0);
    let dir = ps.length ? ps[0].dir : 0;
    // 预览模式：模拟"再加一单"之后的情形
    if (extraUnits) { units += extraUnits; dir = dir || this._previewDir || 1; }
    if (!units || !dir) return null;

    const usedMargin = marginOverride === undefined ? this.usedMargin() : marginOverride;
    const eq = eqOverride === undefined ? this.equity() : eqOverride;
    const lossAvail = eq - usedMargin * (this.liqThreshold() / 100);
    if (lossAvail <= 0) return s.price;                       // 现在就已经在爆仓边缘
    const curThis = ps.reduce((a, p) => a + this.unrealized(p), 0);
    const bearable = curThis + lossAvail;                     // 该品种可再承受的亏损
    const move = bearable / units;
    return dir > 0 ? s.price - move : s.price + move;
  }

  /** 距离爆仓还有多少 pips（正数=还安全） */
  pipsToLiq(pid) {
    const s = this.market.pair(pid);
    const lp = this.liqPriceFor(pid);
    if (lp === null) return Infinity;
    const ps = this.st.positions.filter(p => p.pid === pid);
    if (!ps.length) return Infinity;
    return (lp - s.price) * ps[0].dir / s.def.pip;
  }

  checkRisk() {
    if (!this.hasPosition()) { this.marginCall = null; return; }
    const rate = this.marginRate();
    if (rate <= this.liqThreshold()) {
      // 全部强平
      const list = this.st.positions.slice().sort((a, b) => this.unrealized(a) - this.unrealized(b));
      this.emit('liquidateBegin', {});
      this.fx('crash'); this.hap('crash');
      const recs = list.map(p => this.liquidate(p, 'liquidated'));
      this.st.stats.mental = U.clamp(this.st.stats.mental - 15 * this.mentalLossMul(), 0, 100);
      this.marginCall = null;
      this.emit('liquidated', { recs });
      this.save();
      return;
    }
    const callLine = Math.max(92, 100 - (this.st.stats.level - 1) * 0.8);
    if (rate <= callLine && (!this.marginCall || this.marginCall.level !== 1)) {
      this.st.stats.marginCalls = (this.st.stats.marginCalls || 0) + 1;
      this.marginCall = { level: 1, rate };
      this.fx('alarm'); this.hap('lose');
      this.emit('margincall', { level: 1, rate });
    } else if (rate > 130) {
      this.marginCall = null;
    }
  }

  /** 追证入金 */
  deposit(amount, fromWallet) {
    if (amount <= 0) return { ok: false, why: '金额无效' };
    const pool = fromWallet ? this.st.wallet : this.externalAvailable();
    if (amount > pool + 0.5) return { ok: false, why: '没有这么多钱' };
    if (fromWallet) this.st.wallet -= amount; else this.spendExternal(amount);
    this.st.cash += amount;
    if (this.st.dailyStat) this.st.dailyStat.deposited = (this.st.dailyStat.deposited || 0) + 1;
    this.fx('coin'); this.hap('tap');
    this.pushLog('deposit', '入金', amount);
    this.checkRisk();
    this.save();
    return { ok: true };
  }
  withdraw(amount) {
    if (amount <= 0 || amount > this.st.cash) return { ok: false, why: '出金金额超过可用保证金' };
    this.st.cash -= amount; this.st.wallet += amount;
    this.pushLog('withdraw', '出金', -amount);
    this.fx('click');
    this.save();
    return { ok: true };
  }

  externalAvailable() { return this.st.wallet; }
  spendExternal(a) { this.st.wallet -= a; }

  /* ===== 借贷 ===== */
  loanOffers() {
    return LOAN_PRODUCTS.filter(p => { try { return p.require(this.st); } catch (e) { return false; } });
  }
  borrowedOf(pid) { return this.st.loans.filter(l => l.pid === pid).reduce((a, l) => a + l.amount, 0); }

  borrow(pid, amount) {
    const def = LOAN_PRODUCTS.find(p => p.id === pid);
    if (!def) return { ok: false, why: '不存在的贷款' };
    if (!def.require(this.st)) return { ok: false, why: '对方不会借给你' };
    if (amount <= 0) return { ok: false, why: '金额无效' };
    const already = this.borrowedOf(pid);
    const cap = this.loanLimit(def);
    if (already + amount > cap) return { ok: false, why: `这个渠道的上限是 ${U.fmt(cap)} 円（已借 ${U.fmt(already)}）` };
    const fee = Math.round(amount * def.fee);
    const got = amount - fee;
    this.st.loans.push({ pid, amount, since: this.st.date.day, rollDay: this.st.date.day + def.grace, principal: amount });
    this.st.wallet += got;
    if (this.st.dailyStat) this.st.dailyStat.borrowed = (this.st.dailyStat.borrowed || 0) + 1;
    this.st.stats.loansTaken = this.st.stats.loansTaken || {};
    this.st.stats.loansTaken[pid] = true;
    this.st.flags.hasBorrowed = true;
    this.st.stats.mental = U.clamp(this.st.stats.mental - (def.danger >= 4 ? 6 : 3), 0, 100);
    this.st.stats.greed = U.clamp(this.st.stats.greed + def.danger, 0, 100);
    this.pushLog('loan', `${def.name} 借入 ${U.fmt(amount)} 円（手数料 ${U.fmt(fee)}）`, 0);
    this.fx('loan'); this.hap('lose');
    if (pid === 'mochiko') { this.st.flags.mochikoDeal = true; this.mochiko.mood = 'loan'; }
    this.bark('loan', pid);
    this.emit('borrow', { def, amount, fee });
    this.checkAchievements();
    this.checkDaily('instant');
    this.save();
    return { ok: true, got, fee };
  }

  repay(pid, amount) {
    const def = LOAN_PRODUCTS.find(p => p.id === pid);
    const ls = this.st.loans.filter(l => l.pid === pid);
    if (!ls.length) return { ok: false, why: '没有这笔借款' };
    let pool = Math.min(amount, this.st.cash + this.st.wallet);
    // 先花钱包，再花保证金
    let left = pool, paid = 0;
    for (const l of ls) {
      if (left <= 0) break;
      const pay = Math.min(left, l.amount);
      l.amount -= pay; left -= pay; paid += pay;
    }
    const fromWallet = Math.min(this.st.wallet, paid);
    this.st.wallet -= fromWallet;
    this.st.cash -= (paid - fromWallet);
    this.st.loans = this.st.loans.filter(l => l.amount > 0.5);
    if (paid > 0 && this.st.dailyStat) this.st.dailyStat.repaid = (this.st.dailyStat.repaid || 0) + paid;
    if (def.danger >= 4 && paid > 0) this.st.stats.mental = U.clamp(this.st.stats.mental + 4, 0, 100);
    this.pushLog('repay', `${def.name} 返済 ${U.fmt(paid)} 円`, 0);
    this.fx('coin'); this.hap('tap');
    this.emit('repay', { pid, paid });
    this.checkDaily('instant');
    this.save();
    return { ok: true, paid };
  }

  /** 每日利息与催收 */
  accrueInterest(day) {
    let total = 0;
    for (const l of this.st.loans.slice()) {
      const def = LOAN_PRODUCTS.find(p => p.id === l.pid);
      const interest = l.amount * def.rate / 365;
      l.amount += interest;
      total += interest;
      if (day >= l.rollDay) {
        l.rollDay = day + def.grace;
        if (def.rolloverFee > 0) l.amount += def.rolloverFee;
        this.emit('collect', { def, amount: l.amount });
        if (def.danger >= 4) {
          // 取立て：直接从保证金里扣，不够就吃心理值
          const take = Math.min(this.st.cash > 0 ? this.st.cash : 0, def.danger * 12000);
          this.st.cash -= take;
          if (take < def.danger * 12000) this.st.stats.mental = U.clamp(this.st.stats.mental - 8, 0, 100);
          this.fx('alarm');
          this.emit('harass', { def, take });
        } else if (def.danger >= 3) {
          this.fx('alarm');
          this.emit('harass', { def, take: 0 });
        }
      }
    }
    this.st.loanTotals = total;
  }

  /* ===== 经验 / 成就 ===== */
  /** 升级所需经验 */
  xpNeed(lv) { return 100 + ((lv || this.st.stats.level) - 1) * 85; }

  addXp(n, why) {
    this.st.stats.xp += n;
    let leveled = 0;
    // 一次可能连升多级
    while (this.st.stats.xp >= this.xpNeed()) {
      this.st.stats.xp -= this.xpNeed();
      this.st.stats.level++;
      this.st.stats.insight = Math.min(100, this.st.stats.insight + 4);
      // 升级奖励：1 点洞察（可换 10 万，或买永久技能）
      this.st.insightPts += 1;
      leveled++;
    }
    if (leveled > 0) {
      this.emit('levelup', { level: this.st.stats.level, why, gained: leveled });
      this.fx('bigwin'); this.hap('win');
    }
  }

  /**
   * 强平阈值（维持率）。等级越高越抗打击。
   * 基础 50%，每级 -0.7%，最低 40%。
   * Lv.1 → 50%   Lv.5 → 47.2%   Lv.10 → 43.7%   Lv.15+ → 40%
   */
  liqThreshold() {
    return Math.max(40, 50 - (this.st.stats.level - 1) * 0.7);
  }

  /* ===== 日志 / 对白 ===== */
  pushLog(kind, text, amount) {
    this.st.log.unshift({ kind, text, amount: amount || 0, day: this.st.date.day, t: Date.now() });
    if (this.st.log.length > 120) this.st.log.pop();
  }

  bark(kind, who) {
    if (this.barkCool > 0) return null;
    this.barkCool = 6;
    const src = BARKS[who];
    if (!src) return null;
    const arr = src[kind] || src.idle;
    const line = arr[Math.floor(Math.random() * arr.length)].replace('」，', '」');
    this.emit('bark', { who, line });
    return line;
  }

  /* ===== 教学 ===== */
  hasSeen(id) { return !!this.st.tutorials[id]; }
  seen(id) { this.st.tutorials[id] = 1; this.save(); }

  /* ===== 一日总结数据 ===== */
  snapshot() {
    return {
      equity: this.equity(), margin: this.usedMargin(), rate: this.marginRate(),
      pnl: this.unrealizedAll(), cash: this.st.cash, loan: this.totalLoan(),
      net: this.netAsset(), positions: this.st.positions.length,
    };
  }
}

        { t: '摊平加仓（ナンピン）', b: '亏损时继续加仓拉低均价。<br>顺利的时候它让你更快回本；<br><b class="warn">不顺利的时候，它让你的爆仓价从"还很远"变成"就在脚下"。</b><br>妈妈用过这招。久留美也用过。' },
        { t: '久留美最后的结论', b: '「我知道应该止损。我当然知道。」<br>「但我不甘心。」<br><b class="hl">这个游戏想让你体会的，就是这句话的重量。</b><br>停手这件事，越早越容易，越晚越不可能。' },
      ]
    },
  };

  let core, ui, queue = [], showing = false;

  function init(c, u) { core = c; ui = u; }

  function play(id, force) {
    const def = DEFS[id];
    if (!def) return;
    if (!force && core.hasSeen(id)) return;
    queue.push({ id, def });
    if (!showing) next();
  }

  function next() {
    if (!queue.length) { showing = false; return; }
    showing = true;
    const { id, def } = queue.shift();
    let page = 0;
    const box = document.body;          // 固定定位：#tutSlot 会随屏幕 transform 产生包含块
    const node = el('div', 'tut');
    box.appendChild(node);
    const who = { kurumiIn: ['福賀久留美', '久'], mochiko: ['小金萌智子', '萌'],
                  mebuki: ['山師芽吹', '芽'], yasuko: ['高根やす子', '安'] }[def.who] || ['？？？', '？'];
    const render = () => {
      const p = def.pages[page];
      node.innerHTML = `
        <div class="who"><span class="av">${who[1]}</span>${who[0]}<span class="pages" style="margin-left:auto">${page + 1}/${def.pages.length}</span></div>
        <div class="body"><div style="font-weight:800;font-size:13.5px;margin-bottom:5px;color:var(--pink)">${p.t}</div>${p.b}</div>
        <div class="foot">
          <span style="font-size:10.5px;color:var(--tx3);flex:1">${def.title}</span>
          ${page > 0 ? '<button class="btn btn-ghost btn-xs" data-a="prev">上一页</button>' : ''}
          <button class="btn btn-gold btn-xs" data-a="next">${page === def.pages.length - 1 ? '明白了' : '下一页'}</button>
        </div>`;
      const g = node.querySelectorAll('button');
      g.forEach(b => {
        bindTap(b, () => {
          if (b.dataset.a === 'prev') { page--; render(); Sfx.click(); }
          else {
            if (page < def.pages.length - 1) { page++; render(); Sfx.click(); }
            else { close(); }
          }
        });
      });
    };
    const close = () => {
      core.seen(id);
      node.classList.remove('on');
      setTimeout(() => { node.remove(); next(); }, 300);
      Sfx.close();
    };
    render();
    requestAnimationFrame(() => node.classList.add('on'));
    Sfx.open();
  }

  return { DEFS, init, play, begin: () => Chapters.begin(), force: (id) => play(id, true), get busy() { return showing; } };
})();

/* ---------- 通用小部件 ---------- */
const $$ = (s, r) => (r || document).querySelector(s);
const $$$ = (s, r) => Array.from((r || document).querySelectorAll(s));   // 复数：返回数组
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function ripple(btn, ev) {
  if (!UI.effects) return;
  const r = btn.getBoundingClientRect();
  const d = Math.max(r.width, r.height) * 0.6;
  const s = el('span', 'rip');
  s.style.width = s.style.height = d + 'px';
  s.style.left = ((ev && ev.clientX ? ev.clientX - r.left : r.width / 2) - d / 2) + 'px';
  s.style.top = ((ev && ev.clientY ? ev.clientY - r.top : r.height / 2) - d / 2) + 'px';
  btn.appendChild(s);
  setTimeout(() => s.remove(), 560);
}
function bindTap(node, fn) {
  node.addEventListener('pointerdown', e => { ripple(node, e); Haptics.tap(); Sfx.click(); });
  node.addEventListener('click', e => { e.preventDefault(); fn(e); });
}
function buzzFloat(text, color, x, y) {
  if (!UI.effects) return;
  const d = el('div', 'floaty', text);
  d.style.color = color;
  d.style.left = (x - 22) + 'px';
  d.style.top = (y - 14) + 'px';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1200);
}

    this.buildTabs();
    this.buildScreens();
    this.chart = new CandleChart($$('#chart'));
    this.bindChart();
    this.bindHud();
    this.lastEquity = core.equity();

    Tutorials.init(core, this);
    AIUI.install(core, this);          // AI 交易员（读取本机保存的 API 配置）

  /* ---------- 顶部栏 ---------- */
  bindHud() {
    const c = this.core;
    $$$('#spd button').forEach(b => {
      bindTap(b, () => {

  /* ---------- 相场屏绑定 ---------- */

  buildAmtChips() {

      { l: '1万', v: 1 }, { l: '5万', v: 5 }, { l: '10万', v: 10 }, { l: '50万', v: 50 },
    ];

  get manUnits() { return this._man || 10000; },
  set manUnits(v) { this._man = v; },

  /** 滑块档位 -> 通貨量 */
  unitsFromIdx(i) {
    const table = [10000, 20000, 50000, 100000, 200000, 500000, 1000000, 2000000];
    return table[U.clamp(i, 0, table.length - 1)];
  },
  idxFromUnits(u) {
    const table = [10000, 20000, 50000, 100000, 200000, 500000, 1000000, 2000000];
    let best = 0, bd = Infinity;
    table.forEach((t, i) => { const d = Math.abs(t - u); if (d < bd) { bd = d; best = i; } });
    return best;
  },
  currentUnits() { return this.amtIdx < 0 ? this.manUnits : this.unitsFromIdx(this.amtIdx); },

  maxUnits() {
    const s = this.core.market.pair();
    const perUnit = s.ask() / this.leverage;
    const can = Math.floor(this.core.st.cash / perUnit);
    return Math.max(1, Math.min(2000000, can));
  },

  /** 风险等级 1..4 */
  riskLevel() {
    const u = this.currentUnits(), lev = this.leverage;
    const s = this.core.market.pair();
    const margin = u * s.ask() / lev;
    const cash = this.core.st.cash;
    const ratio = cash > 0 ? margin / cash : 9;
    let r = ratio < 0.1 ? 1 : ratio < 0.3 ? 2 : ratio < 0.6 ? 3 : 4;
    if (lev >= 50) r = Math.max(r, 3);
    if (lev >= 100) r = 4;
    // 有两种死法：杠杆太高，或手数太大（保证金吃掉全部缓冲）
    if (ratio > 0.5) r = 4;
    return r;
  },

  updateOrder() {
    const s = this.core.market.pair();
    const u = this.currentUnits(), lev = this.leverage;
    const margin = u * s.ask() / lev;
    const pipVal = u * s.def.pip;                 // 1pip 的损益
    const span = s.price * 0.01;                  // 波动1%的损益
    const kr = this.riskLevel();
    $$('#levVal').textContent = lev + '×';
    $$('#levVal').classList.toggle('hot', lev >= 25);
    $$('#amtVal').textContent = u >= 10000 ? (u / 10000) + '万' : u;
    $$('#orderSum').innerHTML = `
      <div class="l">必要保证金</div><div class="r mono">${U.fmt(Math.ceil(margin))} 円</div>
      <div class="l">可用保证金</div><div class="r mono">${U.fmt(Math.floor(this.core.freeMargin()))} 円</div>
      <div class="l">1 pip 盈亏</div><div class="r mono">${U.sfmt(pipVal, 0)} 円</div>
      <div class="l">汇率波动 1%</div><div class="r mono">${U.sfmt(span * u, 0)} 円</div>
      <div class="l">爆仓价距离</div><div class="r mono" id="liqDist">—</div>
      <div class="l">风险评级</div><div class="r"><span class="risk-tag risk-${kr}">${['稳健', '普通', '危险', '自杀式'][kr - 1]}</span></div>
    `;
    // 爆仓价：假设这一单成交后，站在新净值下反推强平价
    const liqEl = $$('#liqDist');
    if (liqEl) {
      const afterEq = this.core.equity();
      const afterMargin = this.core.usedMargin() + margin;
      this.core._previewDir = 1;
      const lp = this.core.liqPriceFor(s.def.id, afterEq, afterMargin, u);
      if (lp === null) { liqEl.textContent = '—'; }
      else {
        const move = Math.abs(s.price - lp);
        const pips = move / s.def.pip;
        if (pips <= 0.5) { liqEl.textContent = '开仓即爆（手数过大）'; }
        else liqEl.textContent = `约 ${U.fmt(pips, 1)} pips（${(move / s.price * 100).toFixed(2)}%）`;
        liqEl.style.color = pips <= 0.5 ? 'var(--dn)' : pips < 40 ? 'var(--dn)' : pips < 150 ? 'var(--gold)' : 'var(--tx)';
      }
    }
    // 图上强平线（已持仓时的真实强平价）
    this.chart.liqLine = this.core.hasPosition() ? this.core.liqPriceFor(s.def.id) : null;
    this.chart.o.showMA = !!this.core.st.settings.ma;
  },

  doOpen(dir) {
    const c = this.core;
    const pid = c.market.active;
    const u = this.currentUnits();
    c._previewDir = dir;
    const r = c.open(pid, dir, u, this.leverage);
    if (!r.ok) { this.toast(r.why, 'dn'); Sfx.error(); return; }
    const s = c.market.pair(pid);
    this.toast(`${s.def.short} ${dir > 0 ? '做多' : '做空'} ${U.fmt(u)}通貨 ×${this.leverage}`, dir > 0 ? 'up' : 'dn');
    const btn = $$(dir > 0 ? '#btnBuy' : '#btnSell');
    const r0 = btn.getBoundingClientRect();

      r0.left + r0.width / 2, r0.top - 6);
    if ($$('#tabs button[data-s="pos"]')) this.badge('pos', c.st.positions.length);
    this.renderAll();
    FX.pulse(Theme.of(dir));
    Chapters.check();
  },

  /* ---------- 图交互 ---------- */
  bindChart() {
    const cv = $$('#chart'), ch = this.chart;
    let drag = null, pinch = null, lastTapT = 0;
    const local = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

    cv.addEventListener('pointerdown', e => {
      try { if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId); } catch (err) {}
      const p = local(e);
      drag = { x: p.x, cam: ch.cam, moved: false };
      ch.hover = { i: 0, x: p.x, y: p.y };
    });
    cv.addEventListener('pointermove', e => {
      const p = local(e);
      if (drag) {
        const dx = p.x - drag.x;
        if (Math.abs(dx) > 3) drag.moved = true;
        // 拖动平移：每根宽度
        const bars = this.core.market.pair().view();
        const v = ch.view(bars);
        const perBar = (ch.s.w - ch.o.padLeft - ch.o.padRight) / v.count;
        ch.cam = U.clamp(drag.cam + dx / perBar, 0, Math.max(0, bars.length - 12));
        ch.hover = null;
      } else {
        const bars = this.core.market.pair().view();
        const v = ch.view(bars), hl = ch.highLow(bars, v), sc = ch.makeScale(v, hl);
        ch.hover = { i: sc.invX(p.x), x: p.x, y: p.y };
      }
    });
    const end = (e) => {
      const now = Date.now();
      if (drag && !drag.moved) {
        if (now - lastTapT < 300) { ch.pinch = 1; ch.cam = 0; }   // 双击复位
        lastTapT = now;
      }
      drag = null;
      setTimeout(() => { ch.hover = null; }, 2200);
    };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    cv.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        pinch = { d, p: ch.pinch };
      }
    }, { passive: true });
    cv.addEventListener('touchmove', e => {
      if (pinch && e.touches.length === 2) {
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        ch.pinch = U.clamp(pinch.p * (d / pinch.d), 0.5, 4);
      }
    }, { passive: true });
    cv.addEventListener('touchend', () => { pinch = null; });

    // 图表工具
    $$$('.chart-tools .seg button').forEach(b => {
      bindTap(b, () => {
        if (b.dataset.ma) {
          const on = b.classList.toggle('on');
          this.core.st.settings.ma = on;
          this.chart.o.showMA = on;
          return;
        }
        const z = +b.dataset.zoom;
        this.chart.pinch = 1 / z;
        this.chart.cam = 0;
      });
    });
  },

  renderPairTabs() {
    const box = $$('#pairTabs');
    if (box.childElementCount) {
      $$$('button', box).forEach(b => b.classList.toggle('on', b.dataset.p === this.core.market.active));
      return;
    }
    PAIR_ORDER.forEach(id => {
      const d = PAIRS[id];
      const b = el('button', 'pair-tab', `<span style="color:${d.color}">${d.icon}</span> ${d.short}`);
      b.dataset.p = id;
      if (id === this.core.market.active) b.classList.add('on');
      bindTap(b, () => {
        this.core.market.active = id;
        this.chart.cam = 0; this.chart.pinch = 1;
        this.priceSeries = [];
        this.renderPairTabs();
        this.updateOrder();
      });
      box.appendChild(b);
    });
  },

  /* ---------- 每帧 ---------- */
  frame(dt) {
    const c = this.core;
    const s = c.market.pair();
    const bars = s.view();
    if (this.screen === 'trade') {
      this.chart.liqLine = c.liqPriceFor(s.def.id);
      this.chart.draw(bars, dt);
    }
    this.syncHud(dt);
    if (this.screen === 'pos') this.syncPositions();
    if (this.screen === 'trade') this.syncQuote(s);
  },

  syncHud(dt) {
    const c = this.core;
    const eq = c.equity();
    const ev = $$('#equityVal');
    ev.textContent = U.fmt(eq);
    const d = eq - this.lastEquity;
    if (Math.abs(d) > 1) {
      ev.classList.remove('flash-up', 'flash-dn');
      void ev.offsetWidth;
      ev.classList.add(d > 0 ? 'flash-up' : 'flash-dn');
      this.lastEquity = eq;
    }
    const u = c.unrealizedAll();
    $$('#eqDelta').textContent = U.sfmt(u) + ' 円';
    $$('#eqDelta').className = 'mono ' + (u > 0 ? 'tick-up' : u < 0 ? 'tick-dn' : '');
    // 可用保证金 = 净值 − 必要保证金（之前错显示成账户余额 cash，会误导玩家）
    const free = c.freeMargin();
    const freeEl = $$('#hudCash');
    freeEl.textContent = U.fmt(free);
    freeEl.className = 'v mono' + (free < 0 ? ' tick-dn' : '');
    $$('#hudMargin').textContent = U.fmt(c.usedMargin());
    const rate = c.marginRate();
    $$('#hudRate').textContent = isFinite(rate) ? rate.toFixed(0) + '%' : '—';
    $$('#hudRate').className = 'v mono' + (rate < 150 ? ' tick-dn' : '');
    $$('#hudLoan').textContent = U.fmt(c.totalLoan());
    $$('#hudLoan').className = 'v mono' + (c.totalLoan() > 0 ? ' tick-dn' : '');
    // 保证金率条
    const bar = $$('#marginBar i');
    const pct = U.clamp(isFinite(rate) ? (rate - 50) / 250 * 100 : 0, 0, 100);
    bar.style.width = pct + '%';
    bar.style.background = rate < 100 ? 'var(--dn)' : rate < 200 ? 'var(--gold)' : 'var(--up)';
    $$('#hudDate').textContent = this.dateText();

    // 黑天鹅警示条
    const swTag = $$('#swanTag');
    if (swTag) {
      const sw = c.market.swan;
      if (sw) {
        swTag.style.display = 'block';
        swTag.textContent = '⚡ ' + sw.ev.name + '　点差 ' + sw.spreadMul + '×';
      } else {
        swTag.style.display = 'none';
      }
    }

    // 「入金」按钮直接显示钱包里还有多少钱（之前要点了才知道）
    const dep = $$('#btnDeposit');
    if (dep) {
      const w = c.st.wallet;
      if (w >= 1) {
        dep.textContent = `入金 · 钱包 ${U.yenShort(w)}`;
        dep.classList.add('btn-gold');
        dep.classList.remove('btn-ghost');
      } else {
        dep.textContent = '入金';
        dep.classList.remove('btn-gold');
        dep.classList.add('btn-ghost');
      }
    }

    const mc = c.marginCall;
    if (mc && !this._mcShown) {
      this._mcShown = true;
      FX.alert('追証発生', `保证金率 ${mc.rate.toFixed(0)}% —— 再不处理就要被强平`, 'warn');
      Camera.shake();
    }
    if (!mc) this._mcShown = false;
  },

  dateText() {
    const d = this.core.st.date;
    const dt = U.addDays(2021, 4, 5, d.day);
    return `${dt.y}/${dt.m}/${dt.d}(${U.WEEK[dt.w]}) ${U.pad2(Math.floor(this.core.st.date.tick / TICKS_PER_BAR * 8 + 9))}:00`;
  },

  syncQuote(s) {
    const last = s.bars.length ? s.bars[s.bars.length - 1] : null;
    const p = s.price;
    $$('#cpPrice').textContent = p.toFixed(s.def.digits);
    const up = this.lastPrice ? p >= this.lastPrice : true;
    $$('#cpPrice').className = 'p mono ' + (this.lastPrice ? (up ? 'tick-up' : 'tick-dn') : '');
    const o = last ? last.o : p;
    const dd = (p - o) / o * 100;
    const ddPips = (p - o) / s.def.pip;
    $$('#cpDelta').textContent = `${U.sfmt(ddPips, 1)} pips (${U.sfmt(dd, 2)}%)`;
    $$('#cpDelta').className = 'd mono ' + (dd >= 0 ? 'tick-up' : 'tick-dn');
    this.lastPrice = p;
    $$('#hudPair').textContent = s.def.short;
    $$('#hudPair').style.color = s.def.color;
  },

  /* ---------- 事件 → 界面 ---------- */
  onCore(ev) {
    const c = this.core;
    switch (ev.type) {
      case 'frame': this.frame(ev.dt); break;
      case 'news': {
        this.renderNews();
        if (this.screen === 'trade') FX.newsTicker(ev.news.t);
        break;
      }
      case 'gap': this.toast('週明けギャップ！开盘跳空', 'dn'); break;
      case 'crash': FX.alert('暴落', 'フラッシュクラッシュ', 'bad'); Camera.shake(); break;
      case 'scripted': this.toast('行情突然反转……', 'dn'); break;
      case 'margincall': break;
      case 'liquidateBegin': FX.alert('強制ロスカット', '维持率 50% 割れ', 'bad'); Camera.shake(); break;
      case 'liquidated': {
        const total = ev.recs.reduce((a, r) => a + r.pnl, 0);
        setTimeout(() => {
          Sheets.result('強制ロスカット', total, `追踪保证金耗尽，${ev.recs.length} 笔持仓被强制平仓。`, 'bad');
        }, 900);
        this.renderPositions();
        break;
      }
      case 'swap': {
        if (Math.abs(ev.amount) > 500) this.toast(`スワップ ${U.sfmt(ev.amount)} 円${ev.mult > 1 ? '（3倍日）' : ''}`,
          ev.amount >= 0 ? 'up' : 'dn');
        break;
      }
      case 'collect': {
        setTimeout(() => Sheets.msg('取立て', `【${ev.def.name}】的催收来了。<br>当前负债 <b class="mono" style="color:var(--dn)">${U.fmt(ev.amount)} 円</b>。<br>${ev.def.danger >= 4 ? '「再不还，就不是钱的问题了。」' : '「还款日到了哦。」'}`, ev.def.danger >= 4 ? 'bad' : 'warn'), 400);
        break;
      }
      case 'blackswan': {
        const sw = ev;
        const rows = (sw.hit || []).map(h =>
          `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px">
            <span style="color:${PAIRS[h.id].color}">${PAIRS[h.id].short}</span>
            <span class="mono" style="color:var(--dn);font-weight:700">${h.pct >= 0 ? '+' : ''}${h.pct.toFixed(1)}%</span>
          </div>`).join('');
        setTimeout(() => Sheets.msg('⚡ 黑天鹅',
          `<div style="font-size:13px;font-weight:700;color:var(--dn);line-height:1.6">${sw.ev.head}</div>
           <div style="margin:9px 0">${rows}</div>
           <div style="font-size:11px;color:var(--tx2);line-height:1.7">${sw.ev.desc}</div>
           <div style="margin-top:9px;padding:8px 10px;border-radius:9px;background:rgba(255,77,109,.12);
             border:1px solid rgba(255,77,109,.3);font-size:11.5px">
             点差扩大 <b style="color:var(--dn)">${sw.spreadMul} 倍</b>，持续约 ${Math.round((sw.ev.dur || 40) / 24)} 天。<br>
             <span style="color:var(--tx3)">这时候挂止损单，可能直接被打在异常价位上。</span>
           </div>`, 'bad'), 300);
        break;
      }
      case 'ending': {
        const e = ev.ending;
        setTimeout(() => this.showEnding(e), 500);
        break;
      }
      case 'daily': {
        const list = ev.list || [];
        if (list.length) {
          const names = list.map(x => x.def.name).join('、');
          const pts = list.reduce((a, x) => a + x.pts, 0);
          this.toast(`📋 每日任务：${names}　+${pts} 洞察`, 'up');
          Sfx.coin();
        }
        break;
      }
      case 'achievement': {
        const list = ev.list || [];
        if (list.length) {
          const names = list.map(a => a.name).join('、');
          const pts = list.reduce((a, x) => a + x.pts, 0);
          this.toast(`🏆 成就解锁：${names}　+${pts} 洞察`, 'up');
          Sfx.bigwin();
        }
        break;
      }
      case 'levelup': {
        Sfx.bigwin();
        Sheets.msg('LEVEL UP',
          `交易者等级提升到 <b style="color:var(--gold)">Lv.${ev.level}</b><br>
           <div style="margin-top:10px;padding:9px 11px;border-radius:10px;
             background:rgba(255,209,102,.10);border:1px solid rgba(255,209,102,.3);
             font-size:12px;line-height:1.7">
             🎁 获得 <b style="color:var(--gold)">${ev.gained || 1} 点洞察</b>（可换 10 万，或买永久技能）<br>
             
             <span style="font-size:11px;color:var(--tx2)">强平线已降至 ${this.core.liqThreshold().toFixed(1)}%</span>
           </div>
           <div style="font-size:11px;color:var(--tx3);margin-top:6px">${ev.why || '经验来自每一次真实的盈亏。'}</div>`);
        break;
      }
      case 'bark': FX.bark(ev.who, ev.line); break;
      case 'newday': this.renderLite(); break;
      case 'open': case 'close': case 'borrow': case 'repay':
        this.renderLite(); this.saveTick(); break;
    }
  },
  saveTick() { clearTimeout(this._sv); this._sv = setTimeout(() => this.core.save(), 400); },

  renderLite() {
    const c = this.core;
    const b = $$('#tabs button[data-s="pos"]');
    if (b) this.badge('pos', c.st.positions.length);
    if (this.screen === 'trade') this.renderNews();
    if (this.screen === 'me') this.renderMe();
    if (this.screen === 'loan') this.renderLoans();
  },

  badge(tabId, n) {
    const b = $$(`#tabs button[data-s="${tabId}"]`);
    if (!b) return;
    let bd = $('.badge', b);
    if (n <= 0) { if (bd) bd.remove(); return; }
    if (!bd) { bd = el('span', 'badge'); b.appendChild(bd); }
    bd.textContent = n > 99 ? '99+' : n;
  },

  toast(text, kind) {
    const t = el('div', '', text);
    t.style.cssText = `position:fixed;left:50%;top:calc(var(--safe-t) + 92px);transform:translateX(-50%);
      z-index:180;padding:8px 15px;border-radius:20px;font-size:12.5px;font-weight:700;
      background:${kind === 'dn' ? 'rgba(120,20,44,.94)' : kind === 'up' ? 'rgba(16,90,64,.94)' : 'rgba(24,32,48,.94)'};
      border:1px solid ${kind === 'dn' ? 'rgba(255,77,109,.5)' : kind === 'up' ? 'rgba(61,220,151,.5)' : 'rgba(255,255,255,.16)'};
      box-shadow:0 10px 30px rgba(0,0,0,.55);color:#fff;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;
      animation:toastIn .3s cubic-bezier(.16,1,.3,1)`;
    const st = document.createElement('style');
    st.textContent = '@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-14px) scale(.92)}to{opacity:1;transform:translateX(-50%)}}';
    document.head.appendChild(st);
    document.body.appendChild(t);
    setTimeout(() => { t.style.transition = 'all .3s'; t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(-10px)';
      setTimeout(() => { t.remove(); st.remove(); }, 320); }, 1700);
  },

  /* ---------- 持仓屏 ---------- */
  renderPositions() {
    const c = this.core;
    const box = $$('#posList');
    if (!box) return;
    const sum = $$('#posSummary');
    const u = c.unrealizedAll();
    sum.innerHTML = `
      <div class="hud-cell"><div class="k">浮动盈亏</div><div class="v mono ${u >= 0 ? 'tick-up' : 'tick-dn'}">${U.sfmt(u)}</div></div>
      <div class="hud-cell"><div class="k">必要保证金</div><div class="v mono">${U.fmt(c.usedMargin())}</div></div>
      <div class="hud-cell"><div class="k">维持率</div><div class="v mono">${isFinite(c.marginRate()) ? c.marginRate().toFixed(0) + '%' : '—'}</div></div>`;
    if (!c.st.positions.length) {
      box.innerHTML = `<div class="empty"><span class="big">🕳️</span>现在没有持仓。<br>去「相場」下一单吧。</div>`;
      return;
    }
    box.innerHTML = '';
    for (const p of c.st.positions) {
      const s = c.market.pair(p.pid);
      const pnl = c.unrealized(p);
      const pips = (c.evalPrice(p) - p.entry) * p.dir / s.def.pip;
      const margin = p.units * (p.entry / p.lev);
      const lossPct = U.clamp(-pnl / (margin * c.liqThreshold() / 100) * 100, 0, 100);
      const node = el('div', 'pos ' + (p.dir > 0 ? 'long' : 'short'), `
        <div class="pos-head">
          <span class="pair" style="color:${s.def.color}">${s.def.short}</span>
          <span class="dir-tag ${p.dir > 0 ? 'long' : 'short'}">${p.dir > 0 ? 'LONG' : 'SHORT'}</span>
          <span class="tag">${p.lev}×</span>
          <span class="pos-pnl mono ${pnl >= 0 ? 'tick-up' : 'tick-dn'}">${U.sfmt(pnl)}</span>
        </div>
        <div class="pos-grid">
          <div><div class="k">建値</div><div class="v mono">${p.entry.toFixed(s.def.digits)}</div></div>
          <div><div class="k">現値</div><div class="v mono">${c.evalPrice(p).toFixed(s.def.digits)}</div></div>
          <div><div class="k">数量</div><div class="v mono">${U.fmt(p.units)}</div></div>
          <div><div class="k">pips</div><div class="v mono">${U.sfmt(pips, 1)}</div></div>
        </div>
        <div class="pos-bar"><i style="width:${lossPct}%"></i></div>
        <div style="font-size:10px;color:var(--tx3);margin-top:3px">强平进度 ${lossPct.toFixed(0)}%　保证金 ${U.fmt(margin)} 円</div>
      `);
      const acts = el('div', 'pos-actions',
        `${p.sl ? `<span class="tag dn">SL ${p.sl}</span>` : ''}${p.tp ? `<span class="tag up">TP ${p.tp}</span>` : ''}`);
      const cs = el('button', 'btn btn-ghost btn-sm', '结算全部');
      bindTap(cs, () => {
        const r = c.close(p.id, p.units);
        if (r.ok) {
          this.toast(`${s.def.short} 平仓 ${U.sfmt(r.pnl)} 円`, r.pnl >= 0 ? 'up' : 'dn');
          buzzFloat(U.sfmt(r.pnl), Theme.of(r.pnl), window.innerWidth - 70, 190);
        }
        this.renderPositions();
      });
      acts.appendChild(cs);
      const cf = el('button', 'btn btn-danger btn-sm', '一半平仓');
      bindTap(cf, () => {
        const r = c.close(p.id, Math.floor(p.units / 2));
        if (r.ok) this.toast(`平掉一半 ${U.sfmt(r.pnl)} 円`, r.pnl >= 0 ? 'up' : 'dn');
        this.renderPositions();
      });
      acts.appendChild(cf);
      node.appendChild(acts);
      box.appendChild(node);
    }
  },

  syncPositions() {
    // 轻量刷新：只改数字（避免重建导致动画抖动）
    const c = this.core;
    const box = $$('#posList');
    if (!box) return;
    const nodes = $$$('.pos', box);
    if (nodes.length !== c.st.positions.length) { this.renderPositions(); return; }
    c.st.positions.forEach((p, i) => {
      const n = nodes[i]; if (!n) return;
      const s = c.market.pair(p.pid);
      const pnl = c.unrealized(p);
      const el2 = $('.pos-pnl', n);
      el2.textContent = U.sfmt(pnl);
      el2.className = 'pos-pnl mono ' + (pnl >= 0 ? 'tick-up' : 'tick-dn');
      const g = $$$('.pos-grid .v', n);
      if (g[1]) g[1].textContent = c.evalPrice(p).toFixed(s.def.digits);
      if (g[3]) g[3].textContent = U.sfmt((c.evalPrice(p) - p.entry) * p.dir / s.def.pip, 1);
      const margin = p.units * (p.entry / p.lev);
      const lossPct = U.clamp(-pnl / (margin * c.liqThreshold() / 100) * 100, 0, 100);
      const bar = $('.pos-bar i', n);
      if (bar) bar.style.width = lossPct + '%';
    });
  },

  /* ---------- 借贷屏 ---------- */
  renderLoans() {
    const c = this.core;
    const box = $$('#loanList');
    if (!box) return;
    const tot = c.totalLoan();
    const offers = c.loanOffers();
    const dailyRate = c.st.loans.reduce((a, l) => {
      const d = LOAN_PRODUCTS.find(x => x.id === l.pid); return a + l.amount * d.rate / 365;
    }, 0);
    const days = dailyRate > 0 ? Math.ceil(tot / dailyRate) : Infinity;
    $$('#debtOverview').innerHTML = `
      <div class="card-title"><span class="dot" style="background:var(--dn)"></span>负债总览</div>
      <div class="kv"><span class="k">借款总额</span><span class="v mono ${tot > 0 ? 'tick-dn' : ''}">${U.fmt(tot)} 円</span></div>
      <div class="kv"><span class="k">每日利息</span><span class="v mono">${dailyRate > 0 ? U.fmt(dailyRate, 1) + ' 円' : '0 円'}</span></div>
      <div class="kv"><span class="k">净值（含负债）</span><span class="v mono">${U.fmt(c.netAsset())} 円</span></div>
      <div class="kv"><span class="k">按当前利息</span><span class="v" style="color:${days < 60 ? 'var(--dn)' : days < 200 ? 'var(--gold)' : 'var(--up)'}">
        ${tot <= 0 ? '无负债' : `约 ${days} 天翻一倍`}</span></div>
      ${tot > 0 ? `<div style="margin-top:9px;font-size:11.5px;color:var(--tx2);line-height:1.65">
        你目前有 <b class="mono">${c.st.loans.length}</b> 笔借款。
        ${tot > c.st.cash ? '<br><b class="tick-dn">注意：负债已经超过你的保证金了。</b>' : ''}
      </div>` : ''}`;

    box.innerHTML = '';
    // 已借的
    if (c.st.loans.length) {
      const h = el('div', 'h1', `未还借款<small>OUTSTANDING</small>`);
      h.style.fontSize = '15px'; h.style.marginTop = '12px';
      box.appendChild(h);
      const byPid = {};
      c.st.loans.forEach(l => { byPid[l.pid] = (byPid[l.pid] || 0) + l.amount; });
      for (const pid in byPid) {
        const def = LOAN_PRODUCTS.find(x => x.id === pid);
        const amt = byPid[pid];
        const node = el('div', 'loan-card');
        node.innerHTML = `
          <div class="bar" style="background:${def.color}"></div>
          <div class="loan-h"><span class="nm">${def.name}</span>
            <span class="rt mono debt-fire" style="color:${def.color}">${U.fmt(amt)}</span></div>
          <div class="loan-desc">年利 ${(def.rate * 100).toFixed(1)}% ・ 每日利息约 <b class="mono">${U.fmt(amt * def.rate / 365, 1)}</b> 円</div>
          <div class="loan-meter"><i style="width:${U.clamp(amt / c.loanLimit(def) * 100, 0, 100)}%;background:${def.color}"></i></div>
          <div class="loan-meta"><span>上限 ${U.fmt(c.loanLimit(def))}</span><span>已用 ${(amt / c.loanLimit(def) * 100).toFixed(0)}%</span></div>`;
        const acts = el('div', 'pos-actions');
        const b1 = el('button', 'btn btn-gold btn-sm', '还清这笔');
        bindTap(b1, () => {
          const r = c.repay(pid, amt);
          if (!r.ok) return this.toast(r.why, 'dn');
          this.toast(`已还 ${U.fmt(r.paid)} 円`, 'up');
          Sfx.coin(); this.renderLoans(); this.renderLite();
        });
        const b2 = el('button', 'btn btn-ghost btn-sm', '还一半');
        bindTap(b2, () => {
          const r = c.repay(pid, amt / 2);
          if (!r.ok) return this.toast(r.why, 'dn');
          this.toast(`已还 ${U.fmt(r.paid)} 円`, 'up'); this.renderLoans(); this.renderLite();
        });
        acts.appendChild(b1); acts.appendChild(b2);
        node.appendChild(acts);
        box.appendChild(node);
      }
    }
    const h2 = el('div', 'h1', `可借渠道<small>LOAN OPTIONS</small>`);
    h2.style.fontSize = '15px'; h2.style.marginTop = '12px';
    box.appendChild(h2);
    offers.forEach(def => {
      const used = c.borrowedOf(def.id);
      const avail = c.loanLimit(def) - used;
      const node = el('div', 'loan-card');
      node.innerHTML = `
        <div class="bar" style="background:${def.color};opacity:.85"></div>
        <div class="loan-h"><span class="nm">${def.name}</span>
          <span class="rt" style="color:${def.color}">${def.sub}</span></div>
        <div class="loan-desc">${def.desc}</div>
        <div class="loan-meter"><i style="width:${used / c.loanLimit(def) * 100}%;background:${def.color}"></i></div>
        <div class="loan-meta"><span>可借 ${U.fmt(avail)} 円</span>
          <span>手数料 ${(def.fee * 100).toFixed(0)}%</span>
          <span>还款周期 ${def.grace} 天</span></div>
        ${def.id === 'mochiko' ? '<div style="margin-top:7px;font-size:11px;color:var(--purple);font-style:italic">「年利109%。个人间融资的法定最高利率。你借得起吗？」</div>' : ''}
      `;
      const acts = el('div', 'pos-actions');
      const b = el('button', 'btn ' + (def.danger >= 4 ? 'btn-danger' : def.danger === 3 ? 'btn-gold' : 'btn-ghost') + ' btn-sm', '借款');
      bindTap(b, () => Sheets.borrow(def, c, this));
      acts.appendChild(b);
      node.appendChild(acts);
      box.appendChild(node);
    });
    if (!offers.length) {
      box.appendChild(el('div', 'empty', '<span class="big">🔒</span>还没有任何人愿意借钱给你。<br>先推进剧情，认识更多的人吧。'));
    }
  },

  /* ---------- 人物屏 ---------- */
  /** 结局全屏画面 */
  showEnding(e) {
    // 用实例字段追踪，避免 getElementById 查一个动态创建的节点
    if (this._endingVeil) { this._endingVeil.remove(); this._endingVeil = null; }
    const veil = el('div', '', '');
    veil.setAttribute('data-ending-veil', '1');
    veil.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;padding:26px;text-align:center;' +
      'background:radial-gradient(circle at 50% 30%, rgba(20,26,40,.98), rgba(3,5,9,.99));' +
      'opacity:0;transition:opacity .8s ease';
    const col = e.tone === 'good' ? 'var(--gold)' : 'var(--dn)';
    veil.innerHTML = `
      <div style="font-size:12px;letter-spacing:.35em;color:${col};opacity:.8">
        ${e.tone === 'good' ? 'E N D I N G' : 'E N D I N G'}</div>
